    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef3fb;
        --surface: #ffffff;
        --surface2: #e3ebf9;
        --text: #0b1e3f;
        --dim: #5a6d8f;
        --border: #cfdcf2;
        --accent: #0b5ed7;
        --accent2: #10b981;
        --amber: #f59e0b;
        --coral: #e11d48;
        --rose-soft: #fff1f2;
        --emerald-soft: #ecfdf5;
        --blue-soft: #eff6ff;
        --font-display: "Baloo 2", "Hind Siliguri", system-ui, sans-serif;
        --font-body: "Hind Siliguri", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --surface: #111c30;
          --surface2: #16263f;
          --text: #e8eef7;
          --dim: #8fa3bf;
          --border: #22354f;
          --accent: #38bdf8;
          --accent2: #34d399;
          --rose-soft: rgba(225,29,72,.14);
          --emerald-soft: rgba(16,185,129,.13);
          --blue-soft: rgba(11,94,215,.18);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }
      img { max-width: 100%; }
      .font-display { font-family: var(--font-display); }
      .wrap { margin-inline: auto; width: 100%; padding-inline: 1rem; }
      .wrap-3xl { max-width: 48rem; }
      .wrap-2xl { max-width: 42rem; }
      .wrap-5xl { max-width: 64rem; }

      /* ---------- Animations (same motion language as the platform) ---------- */
      @keyframes floaty { 0% { transform: translateY(0) rotate(var(--rot, 0deg)); opacity: var(--op, .5); } 50% { transform: translateY(-22px) rotate(calc(var(--rot, 0deg) + 8deg)); opacity: calc(var(--op, .5) + .12); } 100% { transform: translateY(0) rotate(var(--rot, 0deg)); opacity: var(--op, .5); } }
      @keyframes drift { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      @keyframes popIn { 0% { transform: scale(.85) translateY(14px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
      @keyframes slideQ { 0% { transform: translateX(46px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
      @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 100% { box-shadow: 0 0 0 16px rgba(16,185,129,0); } }
      @keyframes confettiFall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: .7; } }
      @keyframes bounceSoft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes tickerUp { 0% { transform: translateY(10px); opacity: 0; } 12%, 88% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
      @keyframes aurora { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(46px, -34px) scale(1.18); } 66% { transform: translate(-30px, 22px) scale(.92); } }
      @keyframes sweepX { 0% { transform: translateX(-130%) skewX(-14deg); } 55%, 100% { transform: translateX(260%) skewX(-14deg); } }
      @keyframes twinkle { 0%, 100% { opacity: .1; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.25) rotate(24deg); } }
      @keyframes gradientPan { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes riseIn { 0% { transform: translateY(26px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
      @keyframes explainIn { 0% { opacity: 0; transform: translateY(10px) scale(.98); filter: blur(3px); } 60% { filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
      @keyframes bulbGlow { 0%, 100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.18) rotate(5deg); } }
      @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
      .anim-explain { animation: explainIn .65s cubic-bezier(.2,1,.3,1) both; }
      .anim-bulb { display: inline-block; animation: bulbGlow 1.6s ease-in-out infinite; }
      .anim-aurora { animation: aurora 13s ease-in-out infinite; }
      .anim-sweep { animation: sweepX 4.2s ease-in-out infinite; }
      .anim-twinkle { animation: twinkle 2.6s ease-in-out infinite; }
      .anim-rise { animation: riseIn .6s cubic-bezier(.2,1,.3,1) both; }
      .anim-floaty { animation: floaty 6s ease-in-out infinite; }
      .anim-pop { animation: popIn .45s cubic-bezier(.2,1.4,.4,1) both; }
      .anim-slide-q { animation: slideQ .38s ease both; }
      .anim-shake { animation: shakeX .45s ease; }
      .anim-pulse-glow { animation: pulseGlow .7s ease-out 2; }
      .anim-bounce-soft { animation: bounceSoft 2.2s ease-in-out infinite; }
      .anim-spin-slow { animation: spinSlow 26s linear infinite; }
      .anim-ticker { animation: tickerUp 4.2s ease both; }
      .anim-pulse { animation: pulseSoft 1.6s ease-in-out infinite; }
      .text-anim-gradient { background: linear-gradient(90deg, #34d399, #38bdf8, #fbbf24, #34d399); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradientPan 6s ease infinite; }
      .mesh-bg { background: radial-gradient(600px 300px at 15% 10%, rgba(11,94,215,.5), transparent 60%), radial-gradient(500px 260px at 85% 20%, rgba(16,185,129,.38), transparent 60%), radial-gradient(700px 400px at 50% 100%, rgba(245,158,11,.22), transparent 60%), linear-gradient(160deg, #0b1220 0%, #0d1b33 55%, #081a2e 100%); background-size: 200% 200%; animation: drift 18s linear infinite alternate; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

      /* ---------- Shared components ---------- */
      .card { background: var(--surface); border-radius: 24px; box-shadow: 0 1px 3px rgba(11,30,63,.07); outline: 1px solid var(--border); outline-offset: -1px; }
      .btn { border: 0; border-radius: 16px; padding: .65rem 1rem; font-weight: 700; font-size: .95rem; transition: transform .12s ease, filter .15s ease, background .15s ease; }
      .btn:active { transform: scale(.98); }
      .btn:disabled { opacity: .55; cursor: default; }
      .btn-primary { background: linear-gradient(90deg, #0b5ed7, #10b981); color: #fff; box-shadow: 0 8px 20px rgba(11,94,215,.28); font-family: var(--font-display); font-weight: 800; }
      .btn-primary:hover { filter: brightness(1.1); }
      .btn-dark { background: linear-gradient(90deg, #1e293b, #475569); color: #fff; box-shadow: 0 8px 20px rgba(15,23,42,.3); font-family: var(--font-display); font-weight: 800; }
      .btn-ghost { background: var(--surface); color: var(--dim); box-shadow: 0 1px 3px rgba(11,30,63,.07); outline: 1px solid var(--border); outline-offset: -1px; border-radius: 999px; padding: .5rem 1rem; font-size: .875rem; }
      .btn-ghost:hover { color: var(--coral); }
      .btn-ghost.blue:hover { color: var(--accent); }
      .chip { display: inline-block; border-radius: 999px; padding: .3rem .7rem; font-size: 11px; font-weight: 700; }
      .chip-blue { background: var(--blue-soft); color: #1d4ed8; }
      .chip-green { background: var(--emerald-soft); color: #047857; }
      .chip-amber { background: #fef3c7; color: #b45309; }
      .chip-rose { background: var(--rose-soft); color: #be123c; }
      @media (prefers-color-scheme: dark) { .chip-blue { color: #93c5fd; } .chip-green { color: #6ee7b7; } .chip-amber { background: rgba(245,158,11,.16); color: #fcd34d; } .chip-rose { color: #fda4af; } }
      .field label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: .25rem; }
      .field input, .field select, .field textarea { width: 100%; border-radius: 12px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; padding: .6rem .85rem; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
      .field input:focus, .field select:focus, .field textarea:focus { border-color: #0b5ed7; box-shadow: 0 0 0 4px #dbeafe; }
      .field input::placeholder { color: #b6c2d2; }
      .field .hint { margin-top: .25rem; font-size: 12px; color: #94a3b8; }
      .field.on-app label { color: var(--dim); }
      .field.on-app input, .field.on-app select, .field.on-app textarea { border-color: var(--border); background: var(--surface); color: var(--text); font-size: 14px; padding: .5rem .75rem; }
      .field.on-app input:focus, .field.on-app select:focus, .field.on-app textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,94,215,.18); }
      .alert-error { border-radius: 12px; background: #fff1f2; color: #e11d48; padding: .55rem .8rem; font-size: 13px; font-weight: 600; }
      .alert-ok { border-radius: 12px; background: var(--emerald-soft); color: #047857; padding: .55rem .8rem; font-size: 14px; font-weight: 600; }
      @media (prefers-color-scheme: dark) { .alert-ok { color: #6ee7b7; } }
      .progress-track { height: 12px; border-radius: 999px; background: var(--surface2); overflow: hidden; flex: 1; }
      .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #0b5ed7, #10b981); transition: width .5s ease; }
      .progress-fill.live { background: linear-gradient(90deg, #f43f5e, #f59e0b); }
      .opt-btn { display: flex; width: 100%; align-items: center; gap: .75rem; border: 0; border-radius: 16px; padding: .85rem 1rem; text-align: left; font-size: 15px; font-weight: 600; background: var(--surface2); color: var(--text); transition: box-shadow .15s, transform .1s, background .15s, opacity .15s; }
      .opt-btn:not(:disabled):hover { box-shadow: inset 0 0 0 2px rgba(11,94,215,.5); }
      .opt-btn:not(:disabled):active { transform: scale(.99); }
      .opt-btn:disabled { cursor: default; }
      .opt-letter { font-family: var(--font-display); display: flex; height: 2rem; width: 2rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px; font-size: .875rem; font-weight: 800; background: var(--surface); color: var(--accent); outline: 1px solid var(--border); outline-offset: -1px; }
      .opt-correct { background: #10b981 !important; color: #fff !important; box-shadow: 0 10px 22px rgba(16,185,129,.35); }
      .opt-wrong { background: #f43f5e !important; color: #fff !important; box-shadow: 0 10px 22px rgba(244,63,94,.35); }
      .opt-picked { background: #0b5ed7 !important; color: #fff !important; }
      .opt-dim { opacity: .6; }
      .opt-correct .opt-letter, .opt-wrong .opt-letter, .opt-picked .opt-letter { background: rgba(255,255,255,.25); color: #fff; outline: none; }
      .bottom-nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 30; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 95%, transparent); backdrop-filter: blur(8px); padding-bottom: env(safe-area-inset-bottom); }
      .bottom-nav .inner { margin-inline: auto; display: grid; max-width: 48rem; grid-template-columns: repeat(3, 1fr); }
      .bottom-nav button { border: 0; background: none; padding: .8rem .25rem; text-align: center; font-size: .875rem; font-weight: 700; color: var(--dim); min-height: 3rem; }
      .bottom-nav button.active { color: var(--accent); }
      .avatar { font-family: var(--font-display); display: flex; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #0b5ed7, #10b981); object-fit: cover; }
      .seg { display: grid; gap: .25rem; border-radius: 16px; background: #f1f5f9; padding: .25rem; }
      .seg button { border: 0; border-radius: 12px; padding: .5rem; font-family: var(--font-display); font-size: .875rem; font-weight: 700; color: #64748b; background: none; transition: all .15s; min-height: 2.5rem; }
      .seg button.on { background: #0b5ed7; color: #fff; box-shadow: 0 6px 14px rgba(11,94,215,.3); }
      .seg.dark button.on { background: #0f172a; }
      .seg.rose button.on { background: #0f172a; }
      details summary { min-height: 2.25rem; }
    </style>

      "use strict";
      /* ================= Data: the platform question bank ================= */
      const BANK_DATA = {"bank":[{"category":"C Programming","topic":"Loops","stage":"past","difficulty":"Medium","question":"In C, which loop is best when you know exactly how many times to repeat?","options":["while loop","for loop","do-while loop","goto loop"],"correctIndex":1,"explanation":"for loop packs init, condition and update in one line — perfect for a known count."},{"category":"C Programming","topic":"Data types","stage":"past","difficulty":"Easy","question":"What is the size of an int on most modern 32/64-bit systems in C?","options":["1 byte","2 bytes","4 bytes","8 bytes"],"correctIndex":2,"explanation":"int is typically 4 bytes on modern compilers like GCC."},{"category":"C Programming","topic":"Arrays","stage":"past","difficulty":"Easy","question":"If int a[5] = {10,20,30,40,50}; what is a[2]?","options":["10","20","30","40"],"correctIndex":2,"explanation":"Array index starts at 0, so a[2] is the third element: 30."},{"category":"C Programming","topic":"Functions","stage":"past","difficulty":"Easy","question":"What does a function use to send a value back to the caller?","options":["printf","return","break","scanf"],"correctIndex":1,"explanation":"The return statement sends a value back from a function."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Medium","question":"In C, what is the value of 17 % 5?","options":["2","3","3.4","5"],"correctIndex":0,"explanation":"% gives the remainder: 17 = 5×3 + 2, so the remainder is 2."},{"category":"C Programming","topic":"Pointers","stage":"past","difficulty":"Hard","question":"Which operator gives the address of a variable in C?","options":["*","&","#","@"],"correctIndex":1,"explanation":"& is the address-of operator; * is used to dereference a pointer."},{"category":"C Programming","topic":"Strings","stage":"past","difficulty":"Easy","question":"A string in C always ends with which special character?","options":["\\n","\\t","\\0","$"],"correctIndex":2,"explanation":"Every C string ends with the null character '\\0'."},{"category":"C Programming","topic":"Conditionals","stage":"past","difficulty":"Easy","question":"Which statement is used for multi-way decisions based on one integer value?","options":["if","switch","for","struct"],"correctIndex":1,"explanation":"switch compares one value against many case labels."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Medium","question":"A stack follows which order of insertion and removal?","options":["FIFO","LIFO","Random","Sorted"],"correctIndex":1,"explanation":"Stack is Last In First Out — like a pile of plates."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Medium","question":"In a queue, elements are removed from which end?","options":["Rear end","Middle","Front end","Both ends"],"correctIndex":2,"explanation":"Queue removes from the front and inserts at the rear — First In First Out."},{"category":"Data Structures","topic":"Linked List","stage":"current","difficulty":"Hard","question":"Each node of a singly linked list contains data and…?","options":["Only an index","A pointer to the next node","A copy of the whole list","Two data fields"],"correctIndex":1,"explanation":"A node stores data plus a next pointer linking to the following node."},{"category":"Data Structures","topic":"Arrays vs List","stage":"current","difficulty":"Medium","question":"What is the time complexity of accessing the 100th element of an array by index?","options":["O(n)","O(log n)","O(1)","O(n²)"],"correctIndex":2,"explanation":"Array index access is direct, so it is constant time O(1)."},{"category":"Data Structures","topic":"Trees","stage":"current","difficulty":"Hard","question":"In a binary tree, each node can have at most how many children?","options":["1","2","3","Unlimited"],"correctIndex":1,"explanation":"Binary means at most two children: left and right."},{"category":"Data Structures","topic":"Searching","stage":"current","difficulty":"Medium","question":"Binary search only works correctly when the array is…?","options":["Unsorted","Sorted","Full of duplicates","Stored in a linked list"],"correctIndex":1,"explanation":"Binary search compares with the middle element, which requires sorted data."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Hard","question":"Bubble sort compares and swaps which elements?","options":["First and last","Random pairs","Adjacent pairs","Only even positions"],"correctIndex":2,"explanation":"Bubble sort repeatedly compares neighbouring elements and swaps if out of order."},{"category":"Data Structures","topic":"Recursion","stage":"current","difficulty":"Hard","question":"Every recursive function must have a…?","options":["Loop","Base case","Global variable","Pointer"],"correctIndex":1,"explanation":"Without a base case, recursion never stops and the stack overflows."},{"category":"OOP Concepts","topic":"Class & Object","stage":"current","difficulty":"Medium","question":"What is an object in OOP?","options":["A function","An instance of a class","A data type keyword","A compiler"],"correctIndex":1,"explanation":"A class is the blueprint; an object is a real instance created from it."},{"category":"OOP Concepts","topic":"Encapsulation","stage":"current","difficulty":"Hard","question":"Encapsulation mainly means…?","options":["Hiding data and bundling it with methods","Copying a class","Running code faster","Deleting unused objects"],"correctIndex":0,"explanation":"Encapsulation bundles data + methods and hides internal details."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Medium","question":"Inheritance allows a class to…?","options":["Reuse properties of another class","Become a function","Hide from the compiler","Run without memory"],"correctIndex":0,"explanation":"A child class inherits fields and methods of its parent class."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Hard","question":"Method overloading is an example of…?","options":["Inheritance","Compile-time polymorphism","Encapsulation","Abstraction"],"correctIndex":1,"explanation":"Same method name with different parameters is decided at compile time."},{"category":"OOP Concepts","topic":"Constructor","stage":"current","difficulty":"Medium","question":"When is a constructor called?","options":["When the program ends","When an object is created","When a method is called","Never automatically"],"correctIndex":1,"explanation":"The constructor runs automatically at object creation to initialise it."},{"category":"OOP Concepts","topic":"Access modifiers","stage":"current","difficulty":"Medium","question":"Which member can only be accessed inside its own class?","options":["public","protected","private","static"],"correctIndex":2,"explanation":"private members are visible only within the same class."},{"category":"OOP Concepts","topic":"Abstraction","stage":"current","difficulty":"Medium","question":"Abstraction focuses on…?","options":["Showing only essential features, hiding details","Writing longer code","Using more variables","Avoiding classes"],"correctIndex":0,"explanation":"Like a car steering wheel — you use it without knowing the engine details."},{"category":"OOP Concepts","topic":"Java basics","stage":"current","difficulty":"Medium","question":"In Java, which keyword is used to inherit a class?","options":["implements","extends","inherits","super"],"correctIndex":1,"explanation":"class Child extends Parent — extends is the inheritance keyword."},{"category":"Database • DBMS","topic":"Keys","stage":"current","difficulty":"Medium","question":"A primary key must be…?","options":["Duplicate allowed","Unique and not NULL","Always a string","Changed frequently"],"correctIndex":1,"explanation":"Primary key uniquely identifies each row and can never be NULL."},{"category":"Database • DBMS","topic":"SQL basics","stage":"current","difficulty":"Medium","question":"Which SQL command reads data from a table?","options":["INSERT","UPDATE","SELECT","DELETE"],"correctIndex":2,"explanation":"SELECT is used to query and read rows from a table."},{"category":"Database • DBMS","topic":"SQL filter","stage":"current","difficulty":"Medium","question":"Which clause filters rows in a SELECT query?","options":["ORDER BY","WHERE","GROUP BY","FROM"],"correctIndex":1,"explanation":"WHERE sets the condition rows must satisfy to be returned."},{"category":"Database • DBMS","topic":"Foreign key","stage":"current","difficulty":"Medium","question":"A foreign key in a table refers to…?","options":["Its own primary key only","The primary key of another (or same) table","A password field","An index name"],"correctIndex":1,"explanation":"Foreign keys create relationships between tables."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"The main goal of normalization is to reduce…?","options":["Number of tables to one","Data redundancy","Query speed only","Table size to zero"],"correctIndex":1,"explanation":"Normalization organises tables to remove duplicate data and anomalies."},{"category":"Database • DBMS","topic":"DBMS vs file","stage":"current","difficulty":"Medium","question":"Which is an example of a popular DBMS?","options":["MySQL","Photoshop","MS Word","VLC"],"correctIndex":0,"explanation":"MySQL is a widely used relational DBMS — the one in your course stack."},{"category":"Database • DBMS","topic":"Tables","stage":"current","difficulty":"Medium","question":"In a relational database, one row of a table is also called a…?","options":["Field","Record / tuple","Schema","Query"],"correctIndex":1,"explanation":"Rows are records (tuples); columns are fields (attributes)."},{"category":"Database • DBMS","topic":"SQL sorting","stage":"current","difficulty":"Medium","question":"Which clause sorts the result of a query?","options":["WHERE","LIMIT","ORDER BY","HAVING"],"correctIndex":2,"explanation":"ORDER       const drawQuestions = (category, count, userId) => {
        const rows = category === "Mixed Quiz" ? DB.questions : DB.questions.filter((q) => q.category === category);

        if (userId) DB.attempts.filter((a) => a.userId === userId).forEach((a) => a.answers.forEach((ans) => seen.add(ans.question)));
        const fresh = rows.filter((r) => !seen.has(r.question));

        const queues = {
          Easy: [...shuffle(fresh.filter((r) => r.difficulty === "Easy")), ...shuffle(used.filter((r) => r.difficulty === "Easy"))],
          Medium: [...shuffle(fresh.filter((r) => r.difficulty === "Medium")), ...shuffle(used.filter((r) => r.difficulty === "Medium"))],
          Hard: [...shuffle(fresh.filter((r) => r.difficulty === "Hard")), ...shuffle(used.filter((r) => r.difficulty === "Hard"))],

        const wantE = Math.round(count * 0.4), wantM = Math.round(count * 0.4);
        const want = { Easy: wantE, Medium: wantM, Hard: count - wantE - wantM };
        const picked = [];
        ["Easy", "Medium", "Hard"].forEach((d) => { picked.push(...queues[d].slice(0, want[d])); queues[d] = queues[d].slice(want[d]); });

          <div class="cat-grid" style="margin-top:1rem;display:grid;grid-template-columns:1fr;gap:.75rem">

        const timerPct = Math.max(0, (quiz.seconds / QUESTION_SECONDS) * 100);
        const fb = quiz.feedback;

        document.getElementById("quiz-quit").addEventListener("click", () => { stopQuizTimer(); quiz = null; view = "home"; render(); });

        if (nextBtn) nextBtn.addEventListener("click", advanceSolo);

        stopQuizTimer();

          quizTickTimer = setInterval(() => {

        }
      };

      const answerSolo = (sel) => {
        if (!quiz || quiz.feedback) return;
        const q = quiz.questions[quiz.index];
        const correct = q.correctIndex === sel;
        quiz.selected = sel;
        quiz.feedback = { correct, correctIndex: q.correctIndex, explanation: q.explanation };

        renderQuiz();

            <p style="margin:.5rem 0 0;border-radius:12px;background:var(--emerald-soft);padding:.55rem .8rem;font-size:14px;font-weight:600;color:#047857">সঠিক উত্তর: ${esc(r.options[r.correctIndex] ?? "—")}</p>

          </article>`;

        $app.innerHTML = `
        <div class="wrap wrap-2xl" style="position:relative;overflow:hidden;padding-top:2rem;padding-bottom:3rem">
          ${confetti}

                <circle cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke="var(--surface2)" />

            if (payload.question.length < 5) { adminFormError = "প্রশ্নটা ঠিকমতো লেখো (অন্তত ৫ অক্ষর)।"; return render(); }
            if (payload.options.some((o) => !o)) { adminFormError = "চারটি অপশনই পূরণ করো।"; return render(); }
            if (adminEditingId && adminEditingId > 0) {
              const q = DB.questions.find((x) => x.id === adminEditingId);
              if (q) Object.assign(q, payload);
              adminMsg = "প্রশ্ন আপডেট হয়েছে ✔";
            } else {
              const newId = DB.questions.reduce((m, q) => Math.max(m, q.id), 0) + 1;
              DB.questions.push({ id: newId, ...payload });
              adminMsg = "নতুন প্রশ্ন যোগ হয়েছে ✔";
            }
            adminEditingId = null;
            adminFormDraft = null;
            render();
          });
        }

        if (adminTab === "settings") {
          const readCats = () => DB.categories.map((_, i) => ({
            emoji: (document.querySelector(`[data-cat-emoji="${i}"]`) || {}).value ?? "",
            name: (document.querySelector(`[data-cat-name="${i}"]`) || {}).value ?? "",
            tagline: (document.querySelector(`[data-cat-tagline="${i}"]`) || {}).value ?? "",
            stageLabel: (document.querySelector(`[data-cat-stage="${i}"]`) || {}).value ?? "",
          }));
          $app.querySelectorAll("[data-cat-del]").forEach((b) => b.addEventListener("click", () => {
            const cats = readCats();
            cats.splice(Number(b.dataset.catDel), 1);
            DB.categories = cats;
            adminSettingsMsg = ""; render();
          }));
          document.getElementById("cat-add").addEventListener("click", () => {
            const cats = readCats();
            cats.push({ name: "", tagline: "", emoji: "📘", stageLabel: "Current core" });
            DB.categories = cats;
            render();
          });
          document.getElementById("cat-save").addEventListener("click", () => {
            // Renaming a category must rename it on its questions too —
            // otherwise the renamed category shows 0 questions and its
            // questions are orphaned from category quizzes and filters.
            readCats().forEach((c, i) => {
              const oldName = DB.categories[i] && DB.categories[i].name;
              const newName = c.name.trim();
              if (oldName && newName && oldName !== newName) DB.questions.forEach((q) => { if (q.category === oldName) q.category = newName; });
            });
            const cats = readCats().map((c) => ({ name: c.name.trim(), tagline: c.tagline.trim(), emoji: c.emoji.trim() || "📘", stageLabel: c.stageLabel.trim() || "Current core" })).filter((c) => c.name);
            if (!cats.length) { adminSettingsErr = "অন্তত একটি ক্যাটাগরি রাখো।"; adminSettingsMsg = ""; return render(); }
            DB.categories = cats;
            adminSettingsMsg = "ক্যাটাগরি সেভ হয়েছে ✔"; adminSettingsErr = "";
            render();
          });
          document.getElementById("contact-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            DB.contact = { address: String(fd.get("address") || "").trim(), phone1: String(fd.get("phone1") || "").trim(), phone2: String(fd.get("phone2") || "").trim(), email: String(fd.get("email") || "").trim(), website: String(fd.get("website") || "").trim() };
            adminSettingsMsg = "যোগাযোগের তথ্য সেভ হয়েছে ✔"; adminSettingsErr = "";
            render();
          });
        }
      };

      /* ================= Root ================= */
      const render = () => {
        stopLiveTimer();
        if (view !== "quiz") stopQuizTimer();
        if (view !== "auth") clearInterval(teaserTimer);
        const user = me();
        if (!user) { renderAuth(); return; }
        if (view === "quiz" && quiz) return renderQuiz();
        if (view === "result") return renderResult();
        if (view === "history") return renderHistory();
        if (view === "leaderboard") return renderLeaderboard();
        if (view === "live") return renderLive();
        if (view === "admin") return renderAdmin();
        view = "home";
        renderHome();
      };

      render();
    </script>
  </body>
</html>
