s, and a process can contain several threads."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What is multitasking?","options":["Connecting two computers with a cable","Printing several documents at once","Copying files from one folder to another","Running several programs at the same time by sharing the CPU"],"correctIndex":3,"explanation":"Multitasking lets the operating system switch the CPU rapidly between programs so they appear to run together."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What is the main purpose of CPU scheduling?","options":["To increase the size of the hard disk","To cool down the processor","To decide which process gets the CPU next","To connect the computer to the internet"],"correctIndex":2,"explanation":"CPU scheduling chooses the order in which ready processes use the processor so it is used efficiently."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"Which part of an operating system allocates RAM to running programs?","options":["The web browser","The printer driver","The file icon","Memory management"],"correctIndex":3,"explanation":"Memory management tracks free RAM and gives each running program the memory it needs."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What does a file system do?","options":["It deletes the operating system","It creates new hardware","It speeds up the internet","It organises files and folders on a storage device"],"correctIndex":3,"explanation":"A file system organises how files are named, stored and retrieved on a disk or other storage device."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What is booting?","options":["Deleting old files","Installing a new printer","The process of starting a computer and loading the operating system","Connecting to Wi-Fi"],"correctIndex":2,"explanation":"Booting is the start-up process in which the computer loads the operating system into memory."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What is a device driver?","options":["A person who drives a delivery van","A folder for downloaded files","Software that lets the operating system communicate with a piece of hardware","A cable for a printer"],"correctIndex":2,"explanation":"A device driver is software that translates operating system requests into commands a hardware device understands."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"Which term describes a program that is currently running?","options":["Process","File","Compiler","Icon"],"correctIndex":0,"explanation":"A process is a program in execution, with its own memory, code and resources while it runs."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"In CPU scheduling, what does First Come First Served (FCFS) mean?","options":["The largest process runs first","Processes run in random order","Processes run in the order they arrive","The shortest process runs first"],"correctIndex":2,"explanation":"FCFS schedules processes strictly in arrival order, like a queue at a ticket counter."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"In Round Robin scheduling, what does each process receive?","options":["A new hard disk","The whole CPU forever","A higher priority always","A fixed time slice on the CPU"],"correctIndex":3,"explanation":"Round Robin gives every ready process a fixed time slice in turn, so no process waits too long for the CPU."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What is cache memory?","options":          localStorage: users, attempts, live rooms, contact info and
         admin edits to questions/categories. On load the saved data is
         restored, so sign-up, photo and history survive a reload and
         the same email + password logs in again. Nothing here leaves
         the browser — other devices or browsers cannot see these
         accounts; that needs the server version. */
      const LS_DB_KEY = "simt-quiz-db-v1";
      const LS_SESSION_KEY = "simt-quiz-session-v1";
      let saveDbTimer = null;
      const saveDBNow = () => {
        try {
          localStorage.setItem(LS_DB_KEY, JSON.stringify({ users: DB.users, attempts: DB.attempts, liveRooms: DB.liveRooms, nextUserId: DB.nextUserId, nextAttemptId: DB.nextAttemptId, nextRoomId: DB.nextRoomId, contact: DB.contact, bankLen: BANK_DATA.bank.length, questions: DB.questions, categories: DB.categories }));
          if (window.__simtServer) window.__simtServer.queueSync();
        } catch (e) { /* storage full or unavailable — the page still works in memory */ }
      };
      const saveDB = () => { clearTimeout(saveDbTimer); saveDbTimer = setTimeout(saveDBNow, 250); };
      const saveSession = () => { try { if (sessionUserId) localStorage.setItem(LS_SESSION_KEY, String(sessionUserId)); else localStorage.removeItem(LS_SESSION_KEY); } catch (e) {} };
      const loadStoredDB = () => {
        try {
          const raw = localStorage.getItem(LS_DB_KEY);
          if (raw) {
            const s = JSON.parse(raw);
            if (Array.isArray(s.users)) DB.users = s.users;
            if (Array.isArray(s.attempts)) DB.attempts = s.attempts;
            if (Array.isArray(s.liveRooms)) DB.liveRooms = s.liveRooms;
            if (s.nextUserId) DB.nextUserId = s.nextUserId;
            if (s.nextAttemptId) DB.nextAttemptId = s.nextAttemptId;
            if (s.nextRoomId) DB.nextRoomId = s.nextRoomId;
            if (s.contact) DB.contact = s.contact;
            // Restore admin-edited questions/categories only when the
            // shipped bank is unchanged; a new question batch ships
            // fresh from BANK_DATA instead of stale stored copies.
            if (s.bankLen === BANK_DATA.bank.length) {
              if (Array.isArray(s.questions) && s.questions.length) DB.questions = s.questions;
              if (Array.isArray(s.categories) && s.categories.length) DB.categories = s.categories;
            }
          }
          const sid = Number(localStorage.getItem(LS_SESSION_KEY) || 0);
          if (sid && DB.users.some((u) => u.id === sid)) sessionUserId = sid;
        } catch (e) { /* corrupted or unavailable storage — start fresh */ }
      };
      loadStoredDB();
      window.addEventListener("pagehide", saveDBNow);
      document.addEventListener("visibilitychange", () => { if (document.hidden) saveDBNow(); });

      /* ================= Helpers ================= */
      const $app = document.getElementById("app");
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const shuffle = (arr) => { const c = [...arr]; for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
      const hashPassword = (password) => {
        const input = `simt-quiz::${password}::v1`;
        let h1 = 0x811c9dc5, h2 = 5381;
        for (let i = 0; i < input.length; i++) { const c = input.charCodeAt(i); h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0; h2 = (Math.imul(h2, 33) ^ c) >>> 0; }
        return h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
      };
      const isAdminEmail = (email) => email.trim().toLowerCase() === ADMIN_EMAIL;
      const me = () => DB.users.find((u) => u.id === sessionUserId) || null;
      const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { timeZone: "Asia/Dhaka", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : "—";

      const avatarById = (userId, size, fontSize) => { const u = DB.users.find((x) => x.id === userId); return u ? avatarHtml(u, size, fontSize) : ""; };

      /* Balanced draw: ~40% Easy, ~40% Medium, ~20% Hard; questions this
         student has not attempted yet come first, so every attempt — and
         every student — gets a different set and order. */
      const drawQuestions = (category, count, userId) => {
        const rows = category === "Mixed Quiz" ? DB.questions : DB.questions.filter((q) => q.category === category);
        const seen = new Set();
        if (userId) DB.attempts.filter((a) => a.userId === userId).forEach((a) => a.answers.forEach((ans) => seen.add(ans.question)));
        const fresh = rows.filter((r) => !seen.has(r.question));
        const used = rows.filter((r) => seen.has(r.question));
        const queues = {
          Easy: [...shuffle(fresh.filter((r) => r.difficulty === "Easy")), ...shuffle(used.filter((r) => r.difficulty === "Easy"))],
          Medium: [...shuffle(fresh.filter((r) => r.difficulty === "Medium")), ...shuffle(used.filter((r) => r.difficulty === "Medium"))],
          Hard: [...shuffle(fresh.filter((r) => r.difficulty === "Hard")), ...shuffle(used.filter((r) => r.difficulty === "Hard"))],
        };
        const wantE = Math.round(count * 0.4), wantM = Math.round(count * 0.4);
        const want = { Easy: wantE, Medium: wantM, Hard: count - wantE - wantM };
        const picked = [];
        ["Easy", "Medium", "Hard"].forEach((d) => { picked.push(...queues[d].slice(0, want[d])); queues[d] = queues[d].slice(want[d]); });
        if (picked.length < count) { const rest = shuffle([...queues.Easy, ...queues.Medium, ...queues.Hard]); picked.push(...rest.slice(0, count - picked.length)); }
        return shuffle(picked).slice(0, count);
      };

      const myStats = (userId) => {
        const mine = DB.attempts.filter((a) => a.userId === userId);
        return {
          attempts: mine,
          totalAttempts: mine.length,
          totalQuestions: mine.reduce((s, a) => s + a.total, 0),
          totalCorrect: mine.reduce((s, a) => s + a.score, 0),
          bestPercent: mine.length ? Math.max(...mine.map((a) => Math.round((a.score / a.total) * 100))) : 0,
        };
      };
      const leaderboardEntries = () => {
        const byUser = new Map();
        DB.attempts.forEach((a) => {
          const cur = byUser.get(a.userId) || { attempts: 0, totalCorrect: 0, totalQuestions: 0, bestPercent: 0 };
          cur.attempts += 1; cur.totalCorrect += a.score; cur.totalQuestions += a.total;
          cur.bestPercent = Math.max(cur.bestPercent, Math.round((a.score / a.total) * 100));
          byUser.set(a.userId, cur);
        });
        const real = [...byUser.entries()]
          .map(([userId, s]) => ({ user: DB.users.find((u) => u.id === userId), ...s }))
          .filter((e) => e.user && !HIDDEN_TEST_STUDENT_IDS.has(e.user.studentId));
        const seenIds = new Set(real.map((e) => e.user.studentId));

        // is shown once — through the demo row — so nobody appears twice.
        const loggedIn = me();

        const board = [...real, ...demo]
          .sort((a, b) => b.totalCorrect - a.totalCorrect || b.bestPercent - a.bestPercent);
        // Argha is always #1 on the leaderboard.
        const arghaIdx = board.findIndex((e) => e.user.studentId === "CSE-2324001");
        if (arghaIdx > 0) { const [argha] = board.splice(arghaIdx, 1); board.unshift(argha); }
        return board.slice(0, 10);

      const myLiveEvents = (userId) => DB.liveRooms

      const liveCats = Object.entries(liveCatCounts).sort((a, b) => b[1] - a[1]);
        const glyphs = GLYPHS.map((g, i) => `<span aria-hidden="true" class="anim-floaty" style="pointer-events:none;position:absolute;user-select:none;font-family:var(--font-display);font-weight:700;color:#fff;left:${(i * 67) % 92 + 2}%;top:${(i * 37) % 88 + 4}%;font-size:${13 + (i % 4) * 6}px;opacity:${0.07 + (i % 3) * 0.035};--rot:${(i % 5) * 9 - 18}deg;--op:${0.07 + (i % 3) * 0.035};animation-delay:${i * 0.55}s;z-index:0">${esc(g)}</span>`).join("");

          <p style="margin:.15rem 0 0;font-size:14px;color:var(--dim)">মোট ${totalQ}টি প্রশ্ন • প্রতি কুইজে ৩০টি, প্রতি প্রশ্নে ৩০ সেকেন্ড, মোট সময় ১৫ মিনিট</p>

              const stageCls = c.stageLabel === "Coming up" ? "chip-amber" : c.stageLabel === "Current core" ? "chip-green" : "chip-blue";

            }).join("")}

        <style>
          @media (min-width:640px){.cat-grid{grid-template-columns:1fr 1fr !important}}

        </style>`;

        document.getElementById("hdr-logout").addEventListener("click", logout);

        if (adminBtn) adminBtn.addEventListener("click", () => { view = "admin"; render(); });
        document.getElementById("start-mixed").addEventListener("click", () => startQuiz("Mixed Quiz", SOLO_COUNT));
        document.getElementById("go-live").addEventListener("click", () => { view = "live"; render(); });
        $app.querySelectorAll("[data-cat]").forEach((b) => b.addEventListener("click", () => startQuiz(b.dataset.cat, SOLO_COUNT)));
        $app.querySelectorAll("[data-nav]").forEach((b) => b.addEventListener("click", () => { view = b.dataset.nav; render(); }));
        document.getElementById("photo-input").addEventListener("change", (e) => {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          if (f.size > 3 * 1024 * 1024) { document.getElementById("photo-err").textContent = "ছবিটা বেশি বড় — 3MB-এর নিচের ছবি দাও।"; return; }
          const reader = new FileReader();
          reader.onload = () => { user.photo = String(reader.result); render(); };
          reader.onerror = () => { document.getElementById("photo-err").textContent = "ছবি আপলোড হয়নি, আবার চেষ্টা করো।"; };
          reader.readAsDataURL(f);
        });
      };

      /* ================= Solo quiz ================= */
      const startQuiz = (category, count) => {
        const user = me();
        const questions = drawQuestions(category, count, user.id);
        if (!questions.length) return;
        quiz = { category, questions, index: 0, score: 0, streak: 0, bestStreak: 0, review: [], selected: null, feedback: null, seconds: QUESTION_SECONDS, totalSeconds: questions.length * TOTAL_SECONDS_PER_QUESTION, totalLeft: questions.length * TOTAL_SECONDS_PER_QUESTION, startedAt: Date.now() };
        view = "quiz";
        render();
      };

      const stopQuizTimer = () => { if (quizTickTimer) { clearInterval(quizTickTimer); quizTickTimer = null; } };

      const renderQuiz = () => {
        const q = quiz.questions[quiz.index];
        if (!q) { view = "home"; return render(); }
        const progress = (quiz.index / quiz.questions.length) * 100;
        const timerPct = Math.max(0, (quiz.seconds / QUESTION_SECONDS) * 100);
        const fb = quiz.feedback;
        $app.innerHTML = `
        <div class="wrap wrap-2xl" style="padding-top:1rem;padding-bottom:2.5rem">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem">
            <button id="quiz-quit" class="btn-ghost" style="border:0">✕ ছেড়ে দাও</button>
            <span class="card" style="border-radius:999px;padding:.5rem .9rem;font-size:14px;font-weight:700">${esc(quiz.category)}</span>
            <span style="border-radius:999px;background:#fef3c7;padding:.5rem .9rem;font-size:14px;font-weight:800;color:#b45309" class="${quiz.streak >= 3 ? "anim-bounce-soft" : ""}">🔥 Streak ${quiz.streak}</span>
          </div>
          <div style="margin-top:1rem;display:flex;align-items:center;gap:.75rem">
            <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            <span style="font-size:14px;font-weight:700;color:var(--dim)">${quiz.index + 1}/${quiz.questions.length}</span>
          </div>
          <div style="margin-top:.5rem;display:flex;align-items:center;gap:.75rem">

            <div class="progress-track" style="height:8px"><div id="quiz-total-fill" style="height:100%;border-radius:999px;transition:width 1s linear;${quiz.totalLeft <= 60 ? "background:#f43f5e" : "background:#0b5ed7"};width:${Math.max(0, (quiz.totalLeft / quiz.totalSeconds) * 100)}%"></div></div>
            <span style="font-size:12px;font-weight:700;color:var(--dim)">মোট ${fmtClock(quiz.totalSeconds)}</span>
          </div>

          <div class="anim-slide-q card" style="margin-top:1.25rem;border-radius:28px;padding:1.5rem;box-shadow:0 14px 30px rgba(11,30,63,.12)">
            <div style="display:flex;flex-wrap:wrap;gap:.5rem">

            <div style="margin-top:1.25rem;display:grid;gap:.6rem">
              ${q.options.map((opt, i) => {
                let cls = "";

                  if (fb.correctIndex === i) cls = "opt-correct anim-pulse-glow";
                  else if (quiz.selected === i) cls = "opt-wrong anim-shake";
                  else cls = "opt-dim";

                return `<button class="opt-btn ${cls}" data-opt="${i}" ${fb ? "disabled" : ""} aria-label="Option ${String.fromCharCode(65 + i)}: ${esc(opt)}"><span class="opt-letter">${mark}</span><span style="flex:1">${esc(opt)}</span></button>`;

              <p class="font-display" style="margin:0;font-size:16px;font-weight:800;${fb.correct ? "" : ""}">${quiz.selected === -1 ? "⏰ সময় শেষ!" : fb.correct ? "🎉 সঠিক উত্তর! দারুণ!" : "😅 ভুল হলো — ব্যাপার না!"}</p>
              <p class="anim-explain" style="margin:.4rem 0 0;border-radius:12px;background:rgba(255,255,255,.6);padding:.55rem .8rem;font-size:14px;line-height:1.6;color:var(--text)"><span class="anim-bulb" style="margin-right:.25rem">💡</span>${esc(fb.explanation)}</p>
              <button id="quiz-next" class="btn btn-primary" style="margin-top:.75rem;width:100%;background:#0b5ed7;box-shadow:0 8px 18px rgba(11,94,215,.3)">${quiz.index + 1 >= quiz.questions.length ? "রেজাল্ট দেখো 🏁" : "পরের প্রশ্ন →"}</button>
            </div>` : ""}
          </div>
          <div style="margin-top:1rem">${footerHtml(false)}</div>

        document.getElementById("quiz-quit").addEventListener("click", () => { stopQuizTimer(); quiz = null; view = "home"; render(); });

      const answerSolo = (sel) => {
        if (!quiz || quiz.feedback) return;
        const q = quiz.questions[quiz.index];

        quiz.feedback = { correct, correctIndex: q.correctIndex, explanation: q.explanation };
        if (correct) { quiz.score += 1; quiz.streak += 1; quiz.bestStreak = Math.max(quiz.bestStreak, quiz.streak); } else { quiz.streak = 0; }
        quiz.review.push({ question: q.question, topic: q.topic, options: q.options, selectedIndex: sel, correctIndex: q.correctIndex, explanation: q.explanation, correct });
        stopQuizTimer();
        renderQuiz();
      };

      const autoFinishSolo = () => {
        if (!quiz) return;
        // Total time is over: every question not answered yet counts as
        // wrong, then the quiz submits exactly like a normal finish.
        const answered = new Set(quiz.review.map((r) => r.question));
        quiz.questions.forEach((q) => {
          if (!answered.has(q.question)) quiz.review.push({ question: q.question, topic: q.topic, options: q.options, selectedIndex: -1, correctIndex: q.correctIndex, explanation: q.explanation, correct: false });
        });
        finishSolo();
      };

      const advanceSolo = () => {
        if (!quiz) return;
        if (quiz.index + 1 >= quiz.questions.length) { finishSolo(); return; }
        quiz.index += 1;
        quiz.selected = null; quiz.feedback = null; quiz.seconds = QUESTION_SECONDS;
        renderQuiz();
      };

      const finishSolo = () => {
        const user = me();
        const total = quiz.questions.length;
        const attempt = {
          id: DB.nextAttemptId++, userId: user.id, category: quiz.category, score: quiz.score, total,
          createdAt: new Date().toISOString(),
          answers: quiz.review.map((r) => ({ question: r.question, topic: r.topic, selectedIndex: r.selectedIndex, correctIndex: r.correctIndex, selectedText: r.selectedIndex >= 0 ? (r.options[r.selectedIndex] ?? "") : "", correctText: r.options[r.correctIndex] ?? "", explanation: r.explanation, correct: r.correct })),
        };
        DB.attempts.push(attempt);
        lastResult = { category: quiz.category, score: quiz.score, total, bestStreak: quiz.bestStreak, review: quiz.review };
        quiz = null;
        view = "result";
        render();
      };

      const renderResult = () => {
        const user = me();
        if (!lastResult) { view = "home"; return render(); }

        const message = pct >= 80 ? "অসাধারণ! তুমি টপার লেভেলে আছো 🏆" : pct >= 60 ? "খুব ভালো! আরেকটু হলেই টপে 🔥" : pct >= 40 ? "ভালো চেষ্টা! প্র্যাকটিস করলেই বাড়বে 💪" : "শুরুটা হলো — আবার খেললেই স্কোর বাড়বে 🌱";
        const ring = 2 * Math.PI * 52;
        const wrongOnes = review.filter((r) => !r.correct);
        const rightOnes = review.filter((r) => r.correct);
        const catAttempts = DB.attempts.filter((a) => a.category === category);
        const catParticipants = new Set(catAttempts.map((a) => a.userId)).size;
        const board = leaderboardEntries();
        const myRank = board.findIndex((e) => e.user.id === user.id) + 1;
        const confetti = pct >= 40 ? Array.from({ length: 42 }, (_, i) => `<span aria-hidden="true" style="pointer-events:none;position:absolute;top:0;z-index:0;left:${(i * 23.7) % 100}%;width:${7 + (i % 4) * 3}px;height:${(7 + (i % 4) * 3) * (i % 3 === 0 ? 1 : 0.5)}px;background:${["#0b5ed7", "#10b981", "#f59e0b", "#fb7185", "#38bdf8"][i % 5]};border-radius:${i % 3 === 0 ? "50%" : "2px"};animation:confettiFall ${2.6 + (i % 5) * 0.5}s ease-in ${(i % 12) * 0.28}s both"></span>`).join("") : "";
        const reviewCard = (r, i, delayStep) => `

            <p style="margin:.6rem 0 0;border-radius:12px;background:var(--rose-soft);padding:.55rem .8rem;font-size:14px;font-weight:600;color:#be123c">তোমার উত্তর: ${r.selectedIndex >= 0 ? esc(r.options[r.selectedIndex] ?? "—") : "⏰ সময় শেষ — উত্তর দেওয়া হয়নি"}</p>
            <p style="margin:.5rem 0 0;border-radius:12px;background:var(--emerald-soft);padding:.55rem .8rem;font-size:14px;font-weight:600;color:#047857">সঠিক উত্তর: ${esc(r.options[r.correctIndex] ?? "—")}</p>

            <span aria-hidden="true" class="anim-twinkle" style="position:absolute;bottom:1.5rem;left:2rem;font-size:16px;color:#34d399;animation-delay:1.3s">✦</span>

            <p style="margin:0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)">${esc(category)} • ডিটেইল রেজাল্ট</p>
            <div style="position:relative;margin:1.25rem auto 0;height:144px;width:144px">

                <p class="font-display" style="margin:0;font-size:20px;font-weight:800">📝 ${catAttempts.length}</p>

            <div style="margin-top:1.25rem;display:grid;grid-template-columns:1fr 1fr;gap:.6rem">

        if (room.status === "running") { liveErr = "এই রুমের খেলা ইতিমধ্যে শুরু হয়ে গেছে — এখন আর জয়েন করা যাবে না।"; return render(); }
        if (Object.keys(room.players).length >= MAX_LIVE_PLAYERS && !room.players[user.id]) { liveErr = LIVE_ROOM_FULL_MSG; return render(); }
        if (!room.players[user.id]) room.players[user.id] = newLivePlayer(user.id);

      const liveScreenSig = (room) => {

      const startLiveRoom = () => {

        const now = Date.now();
        if (now <= room.deadlineAt) return;
        Object.values(room.players).forEach((p) => {
          if (!p.answers[room.currentIndex]) {
            p.answers[room.currentIndex] = { questionId: room.questionIds[room.currentIndex], selectedIndex: -1, correct: false, timeMs: LIVE_SECONDS * 1000 };

          }

        const next = room.currentIndex + 1;
        if (next >= room.questionIds.length) { room.status = "finished"; room.deadlineAt = null; }

      /* Overall live clock from the moment the host starts the room:

      const liveTotalLeft = (room) => {

        const total = room.totalSeconds || room.questionIds.length * TOTAL_SECONDS_PER_QUESTION;

          });
        });

      const renderLive = () => {

        let body = "";

          </header>
          <section class="anim-pop" style="position:relative;margin-top:1.25rem;overflow:hidden;border-radius:28px;background:linear-gradient(135deg,#0f172a,#0d1b33,#0b3d2e);padding:1.5rem;color:#fff;box-shadow:0 20px 40px rgba(8,18,38,.35)">
            <div aria-hidden="true" class="anim-aurora" style="pointer-events:none;position:absolute;right:-2.5rem;top:-2.5rem;height:11rem;width:11rem;border-radius:999px;background:rgba(16,185,129,.25);filter:blur(40px)"></div>
            <p style="margin:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:#fcd34d">🛡️ Admin Dashboard</p>
            <h2 class="font-display" style="margin:.25rem 0 0;font-size:30px;font-weight:800">স্বাগতম, ${esc(user.name)}</h2>
            <p style="margin:.25rem 0 0;font-size:14px;color:#cbd5e1">সব শিক্ষার্থী, তাদের স্কোর, র‍্যাংকিং আর ভুল উত্তর — সব এক জায়গায়। শুধু তুমিই এটা দেখতে পাও।</p>
            <div class="adm-stats" style="margin-top:1rem;display:grid;grid-template-columns:1fr 1fr;gap:.6rem;text-align:center">
              ${[[totals.users, "মোট শিক্ষার্থী"], [totals.attempts, "মোট অ্যাটেম্পট"], [totals.attendees, "কুইজে অংশ নিয়েছে"], [totals.totalCorrect, "মোট সঠিক উত্তর"]].map(([v, l]) => `
              <div style="border-radius:16px;background:rgba(255,255,255,.12);padding:.7rem .4rem;backdrop-filter:blur(6px)">
                <p class="font-display" style="margin:0;font-size:24px;font-weight:800">${v}</p>
                <p style="margin:0;font-size:11px;color:#cbd5e1">${l}</p>
              </div>`).join("")}
            </div>
            <style>@media (min-width:640px){.adm-stats{grid-template-columns:repeat(4,1fr) !important}}</style>
          </section>
          <div class="seg dark" style="grid-template-columns:repeat(3,1fr);margin-top:1.25rem;background:var(--surface2)" role="tablist" aria-label="Admin sections">
            ${[["students", "👥 শিক্ষার্থী"], ["questions", "❓ প্রশ্ন এডিট"], ["settings", "⚙️ সেটিংস"]].map(([k, l]) => `<button role="tab" aria-selected="${adminTab === k}" data-atab="${k}" class="${adminTab === k ? "on" : ""}" style="color:${adminTab === k ? "#fff" : "var(--dim)"}">${l}</button>`).join("")}
          </div>
          ${tabBody}
          <div style="margin-top:1rem">${footerHtml(false)}</div>
        </div>`;

        document.getElementById("adm-home").addEventListener("click", () => { view = "home"; render(); });
        document.getElementById("adm-logout").addEventListener("click", logout);
        $app.querySelectorAll("[data-atab]").forEach((b) => b.addEventListener("click", () => { adminTab = b.dataset.atab; adminMsg = ""; adminSettingsMsg = ""; adminSettingsErr = ""; render(); }));
        $app.querySelectorAll("[data-student]").forEach((b) => b.addEventListener("click", () => { const id = Number(b.dataset.student); adminOpenStudent = adminOpenStudent === id ? null : id; render(); }));

        if (adminTab === "questions") {
          document.getElementById("aq-filter").addEventListener("change", (e) => { adminQFilter = e.target.value; adminEditingId = null; adminFormDraft = null; render(); });
          document.getElementById("aq-new").addEventListener("click", () => { adminEditingId = 0; adminFormError = ""; adminMsg = ""; adminFormDraft = null; render(); });
          $app.querySelectorAll("[data-qedit]").forEach((b) => b.addEventListener("click", () => { adminEditingId = Number(b.dataset.qedit); adminFormError = ""; adminMsg = ""; adminFormDraft = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
          $app.querySelectorAll("[data-qdel]").forEach((b) => b.addEventListener("click", () => { adminConfirmDelete = Number(b.dataset.qdel); render(); }));
          $app.querySelectorAll("[data-qdel-confirm]").forEach((b) => b.addEventListener("click", () => {
            const id = Number(b.dataset.qdelConfirm);
            DB.questions = DB.questions.filter((q) => q.id !== id);
            adminConfirmDelete = null; adminMsg = "প্রশ্ন ডিলিট হয়েছে ✔";
            render();
          }));
          const cancel = document.getElementById("aq-cancel");
          if (cancel) cancel.addEventListener("click", () => { adminEditingId = null; adminFormError = ""; adminFormDraft = null; render(); });
          const form = document.getElementById("aq-form");
          if (form) form.addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            const payload = {
              category: String(fd.get("category") || "").trim(),
              topic: String(fd.get("topic") || "").trim(),
              stage: String(fd.get("stage") || "current"),
              difficulty: String(fd.get("difficulty") || "Medium"),
              question: String(fd.get("question") || "").trim(),
              options: [0, 1, 2, 3].map((i) => String(fd.get("opt" + i) || "").trim()),
              correctIndex: Number(fd.get("correct") || 0),
              explanation: String(fd.get("explanation") || "").trim(),
            };
            adminFormDraft = payload;
            adminFormError = "";
            if (!payload.category) { adminFormError = "ক্যাটাগরি বেছে নাও।"; return render(); }
            if (payload.question.length < 5) { adminFormError = "প্রশ্নটা ঠিকমতো লেখো (অন্তত ৫ অক্ষর)।"; return render(); }
            if (payload.options.some((o) => !o)) { adminFormError = "চারটি অপশনই পূরণ করো।"; return render(); }
            if (adminEditingId && adminEditingId > 0) {
              const q = DB.questions.find((x) => x.id === adminEditingId);
              if (q) Object.assign(q, payload);
              adminMsg = "প্রশ্ন আপডেট হয়েছে ✔";
            } else {
              const newId = DB.questions.reduce((m, q) => Math.max(m, q.id), 0) + 1;
              DB.questions.push({ id: newId, ...payload });
              adminMsg = "নতুন প্রশ্ন যোগ হয়েছে ✔";
            }
            adminEditingId = null;
            adminFormDraft = null;
            render();
          });
        }

        if (adminTab === "settings") {
          const readCats = () => DB.categories.map((_, i) => ({
            emoji: (document.querySelector(`[data-cat-emoji="${i}"]`) || {}).value ?? "",
            name: (document.querySelector(`[data-cat-name="${i}"]`) || {}).value ?? "",
            tagline: (document.querySelector(`[data-cat-tagline="${i}"]`) || {}).value ?? "",
            stageLabel: (document.querySelector(`[data-cat-stage="${i}"]`) || {}).value ?? "",
          }));
          $app.querySelectorAll("[data-cat-del]").forEach((b) => b.addEventListener("click", () => {
            const cats = readCats();
            cats.splice(Number(b.dataset.catDel), 1);
            DB.categories = cats;
            adminSettingsMsg = ""; render();
          }));
          document.getElementById("cat-add").addEventListener("click", () => {
            const cats = readCats();
            cats.push({ name: "", tagline: "", emoji: "📘", stageLabel: "Current core" });
            DB.categories = cats;
            render();
          });
          document.getElementById("cat-save").addEventListener("click", () => {
            // Renaming a category must rename it on its questions too —
            // otherwise the renamed category shows 0 questions and its
            // questions are orphaned from category quizzes and filters.
            readCats().forEach((c, i) => {
              const oldName = DB.categories[i] && DB.categories[i].name;
              const newName = c.name.trim();
              if (oldName && newName && oldName !== newName) DB.questions.forEach((q) => { if (q.category === oldName) q.category = newName; });
            });
            const cats = readCats().map((c) => ({ name: c.name.trim(), tagline: c.tagline.trim(), emoji: c.emoji.trim() || "📘", stageLabel: c.stageLabel.trim() || "Current core" })).filter((c) => c.name);
            if (!cats.length) { adminSettingsErr = "অন্তত একটি ক্যাটাগরি রাখো।"; adminSettingsMsg = ""; return render(); }
            DB.categories = cats;
            adminSettingsMsg = "ক্যাটাগরি সেভ হয়েছে ✔"; adminSettingsErr = "";
            render();
          });
          document.getElementById("contact-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            DB.contact = { address: String(fd.get("address") || "").trim(), phone1: String(fd.get("phone1") || "").trim(), phone2: String(fd.get("phone2") || "").trim(), email: String(fd.get("email") || "").trim(), website: String(fd.get("website") || "").trim() };
            adminSettingsMsg = "যোগাযোগের তথ্য সেভ হয়েছে ✔"; adminSettingsErr = "";
            render();
          });
        }
      };

      /* ================= Root ================= */
      const render = () => {
        stopLiveTimer();
        if (view !== "quiz") stopQuizTimer();
        if (view !== "auth") clearInterval(teaserTimer);
        saveDB();
        const user = me();
        if (!user) { renderAuth(); return; }
        if (view === "quiz" && quiz) return renderQuiz();
        if (view === "result") return renderResult();
        if (view === "history") return renderHistory();
        if (view === "leaderboard") return renderLeaderboard();
        if (view === "live") return renderLive();
        if (view === "admin") return renderAdmin();
        view = "home";
        renderHome();
      };

      render();
    </script>
    <script src="backend.js"></script>
  </body>
</html>
