What is the broadcast address of 172.16.8.200 with a /27 subnet mask?","options":["172.16.8.191","172.16.8.207","172.16.8.223","172.16.8.255"],"correctIndex":2,"explanation":"A /27 splits the last octet into blocks of 32, so 200 falls in the 192-223 block and the broadcast address is 172.16.8.223."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Hard","question":"What is the network address of 192.168.10.50 with a /28 subnet mask?","options":["192.168.10.0","192.168.10.32","192.168.10.48","192.168.10.64"],"correctIndex":2,"explanation":"A /28 splits the last octet into blocks of 16, so 50 falls in the 48-63 block and the network address is 192.168.10.48."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Hard","question":"What is the CIDR notation for the subnet mask 255.255.255.224?","options":["/25","/26","/27","/28"],"correctIndex":2,"explanation":"255.255.255.224 has 27 one-bits in the mask (24 + 3), so it is /27."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Hard","question":"What is the CIDR notation for the subnet mask 255.255.255.192?","options":["/24","/25","/26","/27"],"correctIndex":2,"explanation":"255.255.255.192 has 26 one-bits in the mask (24 + 2), so it is /26."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Hard","question":"A company needs 60 usable host addresses per subnet. What is the smallest subnet mask that provides enough addresses?","options":["/27","/28","/25","/26"],"correctIndex":3,"explanation":"60 usable hosts need 6 host bits (2^6 - 2 = 62), leaving 26 network bits, so /26 is the smallest mask that fits."},{"category":"Computer Networking","topic":"TCP/IP","stage":"current","difficulty":"Hard","question":"In TCP, which flag is set in a segment to request closing a connection?","options":["SYN","ACK","FIN","RST"],"correctIndex":2,"explanation":"The FIN flag signals that the sender has finished sending data and wants to close the connection."},{"category":"Computer Networking","topic":"TCP/IP","stage":"current","difficulty":"Hard","question":"Which field in the IPv4 header is decremented by each router and drops the packet at zero?","options":["Protocol","Fragment offset","Checksum","TTL"],"correctIndex":3,"explanation":"The Time To Live (TTL) is reduced by 1 at each router; when it reaches 0 the packet is discarded to prevent infinite looping."},{"category":"Computer Networking","topic":"TCP/IP","stage":"current","difficulty":"Hard","question":"What is the size of the TCP header without options?","options":["8 bytes","16 bytes","20 bytes","32 bytes"],"correctIndex":2,"explanation":"A TCP header without options is 20 bytes long, the same as an IPv4 header without options."},{"category":"Computer Networking","topic":"TCP/IP","stage":"current","difficulty":"Hard","question":"What is the size of the UDP header?","options":["8 bytes","12 bytes","16 bytes","20 bytes"],"correctIndex":0,"explanation":"The UDP header is only 8 bytes: source port, destination port, length and checksum."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Hard","question":"Which protocol maps an IP address to a MAC address on a local network?","options":["DNS","DHCP","ARP","ICMP"],"correctIndex":2,"explanation":"ARP (Address Resolution Protocol) finds the MAC address that belongs to a given IP address."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Hard","question":"Which protocol is used by the ping command to test whether a host is reachable?","options":["UDP","SNMP","ARP","ICMP"],"correctIndex":3,"explanation":"Ping sends ICMP echo-request messages and waits for echo-reply messages."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Hard","question":"Which protocol is used to manage and monitor network devices such as routers and switches?","options":["SNMP","SMTP","FTP","Telnet"],"correctIndex":0,"explanation":"SNMP (Simple Network Management Protocol) collects status and configuration data from network devices."},{"category":"Computer Networking","topic":"Security","stage":"current","difficulty":"Hard","question":"In symmetric-key cryptography, what is true about the encryption and decryption keys?","options":["There is no key","The public key decrypts","They are different","They are the same key"],"correctIndex":3,"explanation":"Symmetric-key cryptography uses one shared secret key for both encryption and decryption."},{"category":"Data Structures","topic":"Array","stage":"current","difficulty":"Easy","question":"What is the time complexity of accessing an element of an array by its index?","options":["O(1)","O(log n)","O(n)","O(n log n)"],"correctIndex":0,"explanation":"Array elements are stored in consecutive memory, so any index can be reached directly in constant time."},{"category":"Data Structures","topic":"Array","stage":"current","difficulty":"Easy","question":"What is the time complexity of searching for a value in an unsorted array of n elements?","options":["O(1)","O(log n)","O(n)","O(n^2)"],"correctIndex":2,"explanation":"In the worst case every element must be checked, so linear search on an unsorted array is O(n)."},{"category":"Data Structures","topic":"Array","stage":"current","difficulty":"Easy","question":"Which of these is a disadvantage of an array compared to a linked list?","options":["Fast insertion in the middle","Uses more pointers","Slow random access","Fixed size"],"correctIndex":3,"explanation":"An array has a fixed size once created, while a linked list can grow and shrink easily."},{"category":"Data Structures","topic":"Array","stage":"current","difficulty":"Easy","question":"What is the index of the first element of an array in C and Java?","options":["-1","n","1","0"],"correctIndex":3,"explanation":"Arrays in C and Java are zero-based, so the first element is at index 0."},{"category":"Data Structures","topic":"Array","stage":"current","difficulty":"Easy","question":"What is the index of the last element of an array of size n in C?","options":["n+1","0","n","n-1"],"correctIndex":3,"explanation":"With zero-based indexing the last of n elements is at index n-1."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Easy","question":"Which order does a stack follow?","options":["FIFO","LIFO","Random","Sorted"],"correctIndex":1,"explanation":"A stack is Last In, First Out: the most recently pushed item is removed first."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Easy","question":"Which operation adds an element to the top of a stack?","options":["Pop","Peek","Push","Enqueue"],"correctIndex":2,"explanation":"Push inserts a new element at the top of the stack."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Easy","question":"Which operation removes the top element from a stack?","options":["Push","Pop","Peek","Delete"],"correctIndex":1,"explanation":"Pop removes and returns the element at the top of the stack."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Easy","question":"Which operation only looks at the top element of a stack without removing it?","options":["Push","Pop","Peek","Enqueue"],"correctIndex":2,"explanation":"Peek (or top) returns the top element while leaving it on the stack."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Easy","question":"What happens when you try to push onto a stack that is already full?","options":["Underflow","Overflow","Deadlock","Segmentation"],"correctIndex":1,"explanation":"Pushing onto a full stack causes a stack overflow."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Easy","question":"What happens when you try to pop from an empty stack?","options":["Overflow","Underflow","Deadlock","Recursion"],"correctIndex":1,"explanation":"Popping from an empty stack causes a stack underflow."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Easy","question":"Which real-life example best matches a stack?","options":["A queue at a ticket counter","A pile of plates","A train line","A dictionary"],"correctIndex":1,"explanation":"Plates are added to and removed from the top of a pile, exactly like a stack."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Easy","question":"Which order does a queue follow?","options":["LIFO","FIFO","Random","Sorted"],"correctIndex":1,"explanation":"A queue is First In, First Out: the element that arrived first leaves first."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Easy","question":"Which operation adds an element to a queue?","options":["Push","Pop","Enqueue","Dequeue"],"correctIndex":2,"explanation":"Enqueue inserts an element at the rear of the queue."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Easy","question":"Which operation removes an element from a queue?","options":["Enqueue","Dequeue","Push","Peek"],"correctIndex":1,"explanation":"Dequeue removes the element at the front of the queue."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Easy","question":"In a queue, new elements are added at which end?","options":["Front","Rear","Middle","Top"],"correctIndex":1,"explanation":"New elements join a queue at the rear, while elements leave from the front."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Easy","question":"Which real-life example best matches a queue?","options":["A pile of books","People waiting in line at a bank","A stack of coins","A family tree"],"correctIndex":1,"explanation":"People in a line are served in the order they arrived, exactly like a queue."},{"category":"Data Structures","topic":"Linked List","stage":"current","difficulty":"Easy","question":"What does each node of a singly linked list contain?","options":["Data and a pointer to the next node","Data only","Two pointers","An index number"],"correctIndex":0,"explanation":"A singly linked list node stores its data plus a pointer to the next node in the list."},{"category":"Data Structures","topic":"Linked List","stage":"current","difficulty":"Easy","question":"What is the time complexity of inserting a new node at the head of a singly linked list?","options":["O(1)","O(log n)","O(n)","O(n^2)"],"correctIndex":0,"explanation":"Inserting at the head only changes a few pointers, so it takes constant time."},{"category":"Data Structures","topic":"Linked List","stage":"current","difficulty":"Easy","question":"What does the last node of a singly linked list point to?","options":["The first node","NULL","Itself","The middle node"],"correctIndex":1,"explanation":"The last node's next pointer is NULL, marking the end of the list."},{"category":"Data Structures","topic":"Linked List","stage":"current","difficulty":"Easy","question":"Which type of linked list lets you move both forward and backward through the nodes?","options":["Singly linked list","Doubly linked list","Circular list","Array"],"correctIndex":1,"explanation":"A doubly linked list has both next and previous pointers, so traversal works in both directions."},{"category":"Data Structures","topic":"Linked List","stage":"current","difficulty":"Easy","question":"In a circular linked list, what does the last node point to?","options":["NULL","The first node","Itself","The second node"],"correctIndex":1,"explanation":"In a circular linked list the last node's next pointer points back to the first node."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"What is the topmost node of a tree called?","options":["Leaf","Root","Child","Parent"],"correctIndex":1,"explanation":"The root is the topmost node of a tree and has no parent."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"What is a node with no children called?","options":["Root","Leaf","Internal node","Sibling"],"correctIndex":1,"explanation":"A leaf node has no children."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"What is the term for nodes that share the same parent?","options":["Ancestors","Siblings","Leaves","Descendants"],"correctIndex":1,"explanation":"Nodes with the same parent are called siblings."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"What is the depth of the root node of a tree?","options":["1","0","-1","Depends on the tree"],"correctIndex":1,"explanation":"Depth counts edges from the root, so the root itself has depth 0."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"What is the height of a tree with only one node?","options":["0","1","2","-1"],"correctIndex":0,"explanation":"A single-node tree has height 0, because there are no edges below the root."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"In a binary tree, what is the maximum number of children a node can have?","options":["1","2","3","4"],"correctIndex":1,"explanation":"By definition each node of a binary tree has at most two children."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"Which traversal of a binary search tree visits nodes in increasing sorted order?","options":["Preorder","Postorder","Inorder","Level order"],"correctIndex":2,"explanation":"Inorder traversal of a BST visits left subtree, node, then right subtree, giving sorted order."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"Which traversal visits the root first, then the left subtree, then the right subtree?","options":["Inorder","Postorder","Preorder","Level order"],"correctIndex":2,"explanation":"Preorder traversal visits the root before its subtrees."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Easy","question":"Which traversal visits the left subtree, then the right subtree, then the root?","options":["Preorder","Inorder","Postorder","Level order"],"correctIndex":2,"explanation":"Postorder traversal visits the root last, after both subtrees."},{"category":"Data Structures","topic":"Searching","stage":"current","difficulty":"Easy","question":"Which search algorithm repeatedly divides a sorted array in half?","options":["Linear search","Binary search","Jump search","Sequential search"],"correctIndex":1,"explanation":"Binary search compares the middle element and discards half of the array at each step."},{"category":"Data Structures","topic":"Searching","stage":"current","difficulty":"Easy","question":"What is the worst-case time complexity of binary search on n elements?","options":["O(1)","O(log n)","O(n)","O(n log n)"],"correctIndex":1,"explanation":"Binary search halves the search space each step, so it needs at most about log2 n comparisons."},{"category":"Data Structures","topic":"Searching","stage":"current","difficulty":"Easy","question":"What is the worst-case time complexity of linear search?","options":["O(1)","O(log n)","O(n)","O(n^2)"],"correctIndex":2,"explanation":"In the worst case linear search must check every one of the n elements."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Easy","question":"Which sorting algorithm repeatedly swaps neighbouring elements that are out of order?","options":["Merge sort","Quick sort","Bubble sort","Heap sort"],"correctIndex":2,"explanation":"Bubble sort compares adjacent pairs and swaps them when they are in the wrong order."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Easy","question":"Which sorting algorithm builds the sorted array one element at a time by inserting each new element into its correct place?","options":["Selection sort","Insertion sort","Merge sort","Heap sort"],"correctIndex":1,"explanation":"Insertion sort takes each element and inserts it into the correct position in the already sorted part."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Easy","question":"Which sorting algorithm repeatedly picks the smallest remaining element and puts it in place?","options":["Bubble sort","Insertion sort","Selection sort","Quick sort"],"correctIndex":2,"explanation":"Selection sort finds the minimum of the unsorted part and swaps it into the next position."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Easy","question":"Which sorting algorithm divides the array into halves, sorts each half and merges them back?","options":["Bubble sort","Merge sort","Selection sort","Insertion sort"],"correctIndex":1,"explanation":"Merge sort is a divide-and-conquer algorithm that recursively splits the array and merges sorted halves."},{"category":"Data Structures","topic":"Hashing","stage":"current","difficulty":"Easy","question":"What is the main purpose of a hash function?","options":["To sort data","To map a key to an index in a table","To encrypt a password","To compress data"],"correctIndex":1,"explanation":"A hash function converts a key into a table index so the value can be found quickly."},{"category":"Data Structures","topic":"Hashing","stage":"current","difficulty":"Easy","question":"What is the average time complexity of searching in a well-designed hash table?","options":["O(1)","O(log n)","O(n)","O(n^2)"],"correctIndex":0,"explanation":"A good hash function gives direct access to the slot, so average search time is constant."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Easy","question":"What is a graph made of?","options":["Nodes and edges","Rows and columns","Keys and values","Stacks and queues"],"correctIndex":0,"explanation":"A graph consists of vertices (nodes) connected by edges."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Easy","question":"What is a graph with no cycles called?","options":["Complete graph","Tree","Cyclic graph","Directed graph"],"correctIndex":1,"explanation":"An acyclic connected graph is a tree; a graph with no cycles at all is called acyclic."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Easy","question":"What is an edge that connects a vertex to itself called?","options":["Loop","Bridge","Path","Cycle"],"correctIndex":0,"explanation":"An edge from a vertex back to itself is called a loop or self-loop."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Medium","question":"What is the best-case time complexity of Bubble Sort on an already sorted array, when the algorithm stops early if no swap occurs?","options":["O(n)","O(n log n)","O(n^2)","O(log n)"],"correctIndex":0,"explanation":"With an early-exit flag, one pass with no swaps proves the array is sorted, so the best case is O(n)."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Medium","question":"What is the worst-case time complexity of Insertion Sort?","options":["O(n)","O(n log n)","O(n^2)","O(log n)"],"correctIndex":2,"explanation":"On a reverse-sorted array each new element must be shifted past all previous elements, giving O(n^2)."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Medium","question":"What is the time complexity of Selection Sort in the worst case?","options":["O(n)","O(n log n)","O(n^2)","O(log n)"],"correctIndex":2,"explanation":"Selection sort always scans the whole unsorted part for the minimum, so it is O(n^2) in every case."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Medium","question":"How many swaps does Selection Sort perform at most on an array of n elements?","options":["n","n-1","n^2","log n"],"correctIndex":1,"explanation":"Selection sort makes at most one swap per pass, and there are n-1 passes, so at most n-1 swaps."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Medium","question":"Which sorting algorithm is stable and has O(n log n) worst-case time but needs O(n) extra space?","options":["Quick sort","Heap sort","Merge sort","Selection sort"],"correctIndex":2,"explanation":"Merge sort is stable, always O(n log n), but it needs an extra array of size n for merging."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Medium","question":"Which sorting algorithm is NOT stable?","options":["Merge sort","Insertion sort","Bubble sort","Heap sort"],"correctIndex":3,"explanation":"Heap sort can move equal elements past each other, so it is not stable, unlike merge, insertion and bubble sort."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Medium","question":"Which data structure is used to check whether parentheses in an expression are balanced?","options":["Queue","Stack","Heap","Hash table"],"correctIndex":1,"explanation":"A stack pushes opening brackets and pops on closing ones; a mismatch or leftover item means the expression is unbalanced."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Medium","question":"What is the result of evaluating the postfix expression 5 3 + 2 * ?","options":["16","13","12","10"],"correctIndex":0,"explanation":"5 + 3 = 8, then 8 * 2 = 16, so the postfix expression evaluates to 16."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Medium","question":"What is the postfix form of the infix expression A + B * C?","options":["A B + C *","A B C * +","A B C + *","A + B C *"],"correctIndex":1,"explanation":"Multiplication has higher precedence, so B * C is done first: A B C * +."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Medium","question":"Which data structure is used to implement a printer spooler that serves jobs in arrival order?","options":["Stack","Queue","Tree","Graph"],"correctIndex":1,"explanation":"A printer spooler serves jobs first-come first-served, which is exactly a queue."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Medium","question":"In a circular queue of size 5 that currently holds 3 elements, how many more elements can be added before it is full?","options":["1","2","3","5"],"correctIndex":1,"explanation":"The queue holds 3 of its 5 slots, so 2 more elements can be added before it is full."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Medium","question":"What is the time complexity of Breadth-First Search on a graph with V vertices and E edges?","options":["O(V)","O(E)","O(V + E)","O(V * E)"],"correctIndex":2,"explanation":"BFS visits every vertex once and examines every edge once, giving O(V + E)."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Medium","question":"What is the time complexity of Depth-First Search on a graph with V vertices and E edges?","options":["O(V)","O(E)","O(V + E)","O(V * E)"],"correctIndex":2,"explanation":"DFS also visits every vertex once and examines every edge once, giving O(V + E)."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Medium","question":"What is the maximum number of nodes in a binary tree of height 3, where the root is at height 1?","options":["7","8","15","31"],"correctIndex":0,"explanation":"A full binary tree of height h has 2^h - 1 nodes; for h = 3 that is 7."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Hard","question":"What is the height of a complete binary tree with 15 nodes, where the root is at height 1?","options":["3","4","5","15"],"correctIndex":1,"explanation":"A complete tree with 15 nodes is full at levels 1 to 4 (1+2+4+8 = 15), so its height is 4."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Hard","question":"In a full binary tree with 25 leaves, how many internal nodes are there?","options":["24","25","26","50"],"correctIndex":0,"explanation":"In a full binary tree the number of internal nodes is always one less than the number of leaves: 25 - 1 = 24."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Hard","question":"What is the minimum height of a binary tree with 63 nodes?","options":["5","6","7","63"],"correctIndex":1,"explanation":"A binary tree of height h holds at most 2^h - 1 nodes, so 63 nodes need height 6 (2^6 - 1 = 63)."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Hard","question":"What is the balance factor of a node in an AVL tree allowed to be?","options":["-1, 0 or 1","0 or 1","-2 to 2","Any value"],"correctIndex":0,"explanation":"An AVL tree keeps every node balanced, so its balance factor (left height minus right height) is only -1, 0 or 1."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Hard","question":"Which rotation is used in an AVL tree when a node is inserted into the right subtree of the right child?","options":["Left rotation","Right rotation","Left-right rotation","Right-left rotation"],"correctIndex":0,"explanation":"A right-right imbalance is fixed by a single left rotation."},{"category":"Data Structures","topic":"Tree","stage":"current","difficulty":"Hard","question":"Which rotation is used in an AVL tree when a node is inserted into the left subtree of the left child?","options":["Left rotation","Right rotation","Left-right rotation","Right-left rotation"],"correctIndex":1,"explanation":"A left-left imbalance is fixed by a single right rotation."},{"category":"Data Structures","topic":"Heap","stage":"current","difficulty":"Hard","question":"What is the time complexity of building a heap from an unsorted array of n elements using bottom-up heapify?","options":["O(n)","O(n log n)","O(log n)","O(n^2)"],"correctIndex":0,"explanation":"Bottom-up heap construction processes each level once and costs O(n) in total, not O(n log n)."},{"category":"Data Structures","topic":"Heap","stage":"current","difficulty":"Hard","question":"What is the time complexity of deleting the maximum element from a max-heap of n elements?","options":["O(1)","O(log n)","O(n)","O(n log n)"],"correctIndex":1,"explanation":"Removing the root and restoring the heap property by sifting the replacement down takes O(log n)."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Hard","question":"How many edges does a complete undirected graph with 8 vertices have?","options":["8","16","28","56"],"correctIndex":2,"explanation":"A complete undirected graph has n(n-1)/2 edges; for n = 8 that is 8 x 7 / 2 = 28."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Hard","question":"How many edges does a complete directed graph with 6 vertices have?","options":["15","30","36","12"],"correctIndex":1,"explanation":"A complete directed graph has n(n-1) edges; for n = 6 that is 6 x 5 = 30."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Hard","question":"In a tree with 20 vertices, how many edges are there?","options":["18","19","20","21"],"correctIndex":1,"explanation":"Every tree with n vertices has exactly n - 1 edges, so 20 vertices give 19 edges."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Hard","question":"Which algorithm finds the shortest path from one source to all other vertices in a graph with non-negative edge weights?","options":["Bellman-Ford","Dijkstra's algorithm","Kruskal's algorithm","Floyd-Warshall"],"correctIndex":1,"explanation":"Dijkstra's algorithm finds shortest paths from a single source when all edge weights are non-negative."},{"category":"Data Structures","topic":"Graph","stage":"current","difficulty":"Hard","question":"Which algorithm can find shortest paths even when some edge weights are negative, and can detect a negative-weight cycle?","options":["Dijkstra's algorithm","Prim's algorithm","Bellman-Ford algorithm","Kruskal's algorithm"],"correctIndex":2,"explanation":"Bellman-Ford relaxes all edges V-1 times, so it handles negative weights and detects negative cycles."},{"category":"Data Structures","topic":"Recursion","stage":"current","difficulty":"Hard","question":"How many moves are needed to solve the Tower of Hanoi puzzle with 4 disks?","options":["7","15","16","31"],"correctIndex":1,"explanation":"Tower of Hanoi needs 2^n - 1 moves; for 4 disks that is 2^4 - 1 = 15."},{"category":"OOP Concepts","topic":"Class and object","stage":"current","difficulty":"Easy","question":"In OOP, which term describes a blueprint from which objects are created?","options":["Variable","Class","Method","Object"],"correctIndex":1,"explanation":"A class is a blueprint that defines fields and methods; objects are instances created from it."},{"category":"OOP Concepts","topic":"Class and object","stage":"current","difficulty":"Easy","question":"Which of these is an instance of a class?","options":["An object","A method","A keyword","A package"],"correctIndex":0,"explanation":"An object is a concrete instance created from a class, with its own field values."},{"category":"OOP Concepts","topic":"Encapsulation","stage":"current","difficulty":"Easy","question":"Which OOP principle bundles data and the methods that work on it into a single unit?","options":["Inheritance","Encapsulation","Abstraction","Polymorphism"],"correctIndex":1,"explanation":"Encapsulation wraps data and methods together inside a class and hides internal details."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Easy","question":"In inheritance, what does a child class receive from its parent class?","options":["Its package only","Only its name","Nothing at all","Its fields and methods"],"correctIndex":3,"explanation":"A child class inherits the accessible fields and methods of its parent class and can add its own."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Easy","question":"Polymorphism in OOP means the same method call can behave in how many ways?","options":["Only in the parent class","Only one way","Only at compile time","Different ways depending on the object"],"correctIndex":3,"explanation":"Polymorphism lets one method name or interface take different forms for different object types."},{"category":"OOP Concepts","topic":"Abstraction","stage":"current","difficulty":"Easy","question":"Abstraction in OOP mainly means showing what?","options":["The memory addresses","All internal code details","Every private field","Only the essential features and hiding the rest"],"correctIndex":3,"explanation":"Abstraction shows only the essential features of an object and hides unnecessary implementation details."},{"category":"OOP Concepts","topic":"Object creation","stage":"current","difficulty":"Easy","question":"In Java, which keyword creates a new object?","options":["object","new","make","create"],"correctIndex":1,"explanation":"The new keyword allocates memory and creates a new object, then the constructor runs."},{"category":"OOP Concepts","topic":"Constructors","stage":"current","difficulty":"Easy","question":"What must a constructor have the same name as?","options":["The package","Its return type","Its first parameter","The class it belongs to"],"correctIndex":3,"explanation":"A constructor always has exactly the same name as its class."},{"category":"OOP Concepts","topic":"Constructors","stage":"current","difficulty":"Easy","question":"Which statement about a constructor is true?","options":["It must be private","It must be static","It has no return type, not even void","It has a return type"],"correctIndex":2,"explanation":"A constructor has no return type at all; writing void would make it an ordinary method."},{"category":"OOP Concepts","topic":"Constructors","stage":"current","difficulty":"Easy","question":"If a class defines no constructor at all, what does Java provide?","options":["A default constructor with no parameters","No constructor","A private constructor","An abstract constructor"],"correctIndex":0,"explanation":"Java supplies a default no-argument constructor when the programmer writes none."},{"category":"OOP Concepts","topic":"Destructors","stage":"current","difficulty":"Easy","question":"In C++, what symbol starts the name of a destructor?","options":["*","@","~","#"],"correctIndex":2,"explanation":"A destructor is named ~ClassName and runs when an object is destroyed."},{"category":"OOP Concepts","topic":"Destructors","stage":"current","difficulty":"Easy","question":"When is a C++ destructor called?","options":["When an object is created","When a method is called","When the program starts","When an object goes out of scope or is deleted"],"correctIndex":3,"explanation":"A destructor runs automatically when an object goes out of scope or is deleted, to release resources."},{"category":"OOP Concepts","topic":"this keyword","stage":"current","difficulty":"Easy","question":"In Java, what does the keyword this refer to?","options":["The parent class","The next object","A static field","The current object"],"correctIndex":3,"explanation":"this refers to the current object, so it can distinguish fields from parameters with the same name."},{"category":"OOP Concepts","topic":"Access modifiers","stage":"current","difficulty":"Easy","question":"Which access modifier allows a member to be used only inside its own class?","options":["protected","public","default","private"],"correctIndex":3,"explanation":"private members are visible only within the class that declares them."},{"category":"OOP Concepts","topic":"Access modifiers","stage":"current","difficulty":"Easy","question":"Which access modifier makes a member accessible from everywhere?","options":["protected","private","final","public"],"correctIndex":3,"explanation":"A public member can be accessed from any class in any package."},{"category":"OOP Concepts","topic":"Access modifiers","stage":"current","difficulty":"Easy","question":"In Java, what does protected allow that private does not?","options":["Access from subclasses and the same package","No access at all","Access from any class","Access only from static methods"],"correctIndex":0,"explanation":"protected members are accessible in the same package and in subclasses, while private members are not."},{"category":"OOP Concepts","topic":"Static","stage":"current","difficulty":"Easy","question":"What is true of a static variable in Java?","options":["It is shared by all objects of the class","Each object gets its own copy","It is created by new","It can only store strings"],"correctIndex":0,"explanation":"A static variable belongs to the class, so all objects share one single copy of it."},{"category":"OOP Concepts","topic":"Static","stage":"current","difficulty":"Easy","question":"What can a static method NOT do directly in Java?","options":["Access instance variables without an object","Use a static variable","Call another static method","Return a value"],"correctIndex":0,"explanation":"A static method has no this reference, so it cannot access instance variables without an object."},{"category":"OOP Concepts","topic":"final keyword","stage":"current","difficulty":"Easy","question":"What happens to a final variable in Java after it is assigned once?","options":["It cannot be reassigned","It becomes static","It becomes private","It can be changed freely"],"correctIndex":0,"explanation":"A final variable is a constant: once assigned, its value cannot be changed."},{"category":"OOP Concepts","topic":"final keyword","stage":"current","difficulty":"Easy","question":"What does it mean when a Java class is declared final?","options":["It has no fields","It cannot be inherited by another class","It has no methods","It cannot be instantiated"],"correctIndex":1,"explanation":"A final class cannot be extended, so no subclass can be created from it."},{"category":"OOP Concepts","topic":"final keyword","stage":"current","difficulty":"Easy","question":"What does a final method in Java prevent?","options":["Calling the method","Returning a value","Overriding the method in a subclass","Declaring the method"],"correctIndex":2,"explanation":"A final method cannot be overridden by any subclass."},{"category":"OOP Concepts","topic":"Abstract class","stage":"current","difficulty":"Easy","question":"What is true of an abstract class in Java?","options":["It cannot have fields","It has no methods","It can be instantiated directly","It cannot be instantiated directly"],"correctIndex":3,"explanation":"An abstract class is incomplete by design, so it cannot be instantiated; a subclass must complete it."},{"category":"OOP Concepts","topic":"Abstract class","stage":"current","difficulty":"Easy","question":"What is an abstract method?","options":["A method that returns nothing","A method declared without a body","A method with a body but no name","A method that is always static"],"correctIndex":1,"explanation":"An abstract method is declared without a body; subclasses must provide its implementation."},{"category":"OOP Concepts","topic":"Interface","stage":"current","difficulty":"Easy","question":"In Java, what does a class use to adopt an interface?","options":["extends","implements","inherits","imports"],"correctIndex":1,"explanation":"A class uses implements to adopt an interface and must define all its methods."},{"category":"OOP Concepts","topic":"Interface","stage":"current","difficulty":"Easy","question":"How many interfaces can a single Java class implement?","options":["None","Only one","Only two","As many as needed"],"correctIndex":3,"explanation":"Java allows a class to implement any number of interfaces, which gives a form of multiple inheritance of type."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Easy","question":"How many classes can a Java class directly extend?","options":["Only one","None","As many as needed","Only two"],"correctIndex":0,"explanation":"Java supports single inheritance for classes, so a class can extend only one direct parent class."},{"category":"OOP Concepts","topic":"Method overloading","stage":"current","difficulty":"Easy","question":"Method overloading means methods in the same class share what?","options":["The same body","The same parameters but different names","The same name but different parameter lists","The same return type only"],"correctIndex":2,"explanation":"Overloaded methods have the same name but differ in the number or types of their parameters."},{"category":"OOP Concepts","topic":"Method overriding","stage":"current","difficulty":"Easy","question":"Method overriding means a subclass does what to a parent method?","options":["Redefines it with the same signature","Makes it static","Renames it","Deletes it"],"correctIndex":0,"explanation":"Overriding redefines a parent method in a subclass using the same name, parameters and return type."},{"category":"OOP Concepts","topic":"super keyword","stage":"current","difficulty":"Easy","question":"In Java, what does the keyword super refer to?","options":["The main class","The parent class","A static class","The current object"],"correctIndex":3,"explanation":"super refers to the parent class, letting a subclass call parent methods or the parent constructor."},{"category":"OOP Concepts","topic":"super keyword","stage":"current","difficulty":"Easy","question":"Where must a call to super() appear inside a subclass constructor?","options":["Outside the constructor","At the end","Anywhere","As the first statement"],"correctIndex":3,"explanation":"super() must be the first statement in a subclass constructor, so the parent part is built first."},{"category":"OOP Concepts","topic":"Encapsulation","stage":"current","difficulty":"Easy","question":"How is encapsulation usually achieved in Java?","options":["Public fields and no methods","Abstract classes only","Private fields with public getter and setter methods","Static fields only"],"correctIndex":2,"explanation":"Keeping fields private and exposing them through public getters and setters controls access to the data."},{"category":"OOP Concepts","topic":"Getter and setter","stage":"current","difficulty":"Easy","question":"What does a getter method do?","options":["Deletes an object","Creates a new class","Returns the value of a field","Changes a field value"],"correctIndex":2,"explanation":"A getter returns the current value of a private field without exposing the field itself."},{"category":"OOP Concepts","topic":"Getter and setter","stage":"current","difficulty":"Easy","question":"What does a setter method do?","options":["Returns a field value","Sets or updates the value of a field","Throws an exception","Creates an object"],"correctIndex":1,"explanation":"A setter assigns a new value to a private field, often after checking that the value is valid."},{"category":"OOP Concepts","topic":"Class and object","stage":"current","difficulty":"Easy","question":"In OOP, the data stored in an object is called its what?","options":["Behaviour","Package","Signature","State"],"correctIndex":3,"explanation":"An object's state is the current values of its fields, while its behaviour is what its methods do."},{"category":"OOP Concepts","topic":"Class and object","stage":"current","difficulty":"Easy","question":"In OOP, what an object can do is called its what?","options":["Package","Behaviour","State","Constructor"],"correctIndex":1,"explanation":"Behaviour is the set of actions an object can perform, defined by its methods."},{"category":"OOP Concepts","topic":"Packages","stage":"current","difficulty":"Easy","question":"What is a package in Java mainly used for?","options":["To group related classes together","To run a program","To create objects","To handle exceptions"],"correctIndex":0,"explanation":"A package groups related classes and interfaces together and helps avoid name clashes."},{"category":"OOP Concepts","topic":"Packages","stage":"current","difficulty":"Easy","question":"Which Java keyword brings a class from another package into a file?","options":["import","using","include","package"],"correctIndex":0,"explanation":"import makes a class from another package available by its simple name in the file."},{"category":"OOP Concepts","topic":"Operators","stage":"current","difficulty":"Easy","question":"In Java, which operator tests whether an object is of a certain type?","options":["check","instanceof","typeof","is"],"correctIndex":1,"explanation":"instanceof returns true when the object on its left is an instance of the type on its right."},{"category":"OOP Concepts","topic":"Memory","stage":"current","difficulty":"Easy","question":"What does Java garbage collection do?","options":["Deletes source files","Compiles the program","Creates new objects","Frees memory of objects no longer referenced"],"correctIndex":3,"explanation":"The garbage collector automatically reclaims memory from objects that no program reference can reach."},{"category":"OOP Concepts","topic":"Composition","stage":"current","difficulty":"Easy","question":"When one object contains another object as a field, what is that relationship called?","options":["Inheritance","Polymorphism","Composition","Abstraction"],"correctIndex":2,"explanation":"Composition is a has-a relationship where an object is built from other objects, such as a Car containing an Engine."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Easy","question":"Which phrase best describes inheritance?","options":["Has-a relationship","Is-a relationship","Creates-a relationship","Uses-a relationship"],"correctIndex":1,"explanation":"Inheritance models an is-a relationship: a Dog is an Animal, so it inherits Animal's traits."},{"category":"OOP Concepts","topic":"Aggregation","stage":"current","difficulty":"Easy","question":"How does aggregation differ from strong composition?","options":["It uses inheritance","It needs no object at all","The contained object can exist on its own","The contained object is destroyed with the owner"],"correctIndex":2,"explanation":"In aggregation the part can exist independently of the whole, like a Teacher existing apart from a Department."},{"category":"OOP Concepts","topic":"Exception handling","stage":"current","difficulty":"Easy","question":"In Java, what is an exception?","options":["A compile-time warning","A syntax error","A type of loop","An event that disrupts normal program flow at runtime"],"correctIndex":3,"explanation":"An exception is an abnormal event at runtime, such as dividing by zero, that disrupts normal execution."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Medium","question":"In Java, when is an overloaded method chosen?","options":["At runtime by the return type","When the program exits","At runtime by the object type","At compile time by the argument types"],"correctIndex":3,"explanation":"Overloading is static polymorphism: the compiler picks the version from the number and types of the arguments."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Medium","question":"In C++, which keyword makes a method use runtime polymorphism?","options":["virtual","final","inline","static"],"correctIndex":0,"explanation":"A virtual method is dispatched at runtime to the most derived override, instead of being fixed at compile time."},{"category":"OOP Concepts","topic":"Constructors","stage":"current","difficulty":"Medium","question":"What is a copy constructor in C++?","options":["A constructor with no parameters","A constructor that deletes an object","A constructor that creates an object from another object of the same class","A constructor that copies a file"],"correctIndex":2,"explanation":"A copy constructor takes a reference to an object of the same class and copies its field values into the new object."},{"category":"OOP Concepts","topic":"Constructors","stage":"current","difficulty":"Medium","question":"In Java, what does this() do inside a constructor?","options":["Destroys the object","Calls the parent constructor","Calls another constructor of the same class","Creates a new object"],"correctIndex":2,"explanation":"this() calls another constructor of the same class, so constructors can reuse each other's initialisation code."},{"category":"OOP Concepts","topic":"Abstract class","stage":"current","difficulty":"Medium","question":"In C++, what makes a class abstract?","options":["Having a private constructor","Having no fields","Having only static methods","Having at least one pure virtual function"],"correctIndex":3,"explanation":"A class with a pure virtual function, declared with = 0, cannot be instantiated and is abstract."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Medium","question":"What is the diamond problem in multiple inheritance?","options":["Too many objects are created","Ambiguity when two parents share a common ancestor","A class cannot have fields","A constructor runs twice"],"correctIndex":1,"explanation":"If two parent classes inherit the same grandparent, a child can inherit two copies of its members, creating ambiguity."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Medium","question":"Why does Java not allow a class to extend two classes directly?","options":["To save memory","To avoid ambiguity from the diamond problem","To forbid all inheritance","To make programs slower"],"correctIndex":1,"explanation":"Multiple class inheritance can create ambiguous inherited members, so Java allows one parent class plus many interfaces instead."},{"category":"OOP Concepts","topic":"Casting","stage":"current","difficulty":"Medium","question":"What is upcasting in Java?","options":["Treating a child object as its parent type","Casting an int to a double","Creating a new object","Casting a parent reference to a child type"],"correctIndex":0,"explanation":"Upcasting treats a subclass object as its parent type; it is implicit and always safe."},{"category":"OOP Concepts","topic":"Casting","stage":"current","difficulty":"Medium","question":"What must a programmer do for downcasting in Java?","options":["Delete the parent object","Nothing, it is automatic","Make the class final","Use an explicit cast and check the type first"],"correctIndex":3,"explanation":"Downcasting a parent reference to a child type needs an explicit cast, and a wrong cast throws ClassCastException at runtime."},{"category":"OOP Concepts","topic":"Exception handling","stage":"current","difficulty":"Medium","question":"In Java, which exceptions are unchecked?","options":["ClassNotFoundException","SQLException","IOException","RuntimeException and its subclasses"],"correctIndex":3,"explanation":"RuntimeException and its subclasses, such as NullPointerException, are unchecked and need not be declared or caught."},{"category":"OOP Concepts","topic":"Exception handling","stage":"current","difficulty":"Medium","question":"What is the difference between throw and throws in Java?","options":["throws creates the exception","throw is for files only","They are the same","throw raises an exception object, throws declares that a method may raise one"],"correctIndex":3,"explanation":"throw actually raises an exception object, while throws in a method header declares which checked exceptions the method may raise."},{"category":"OOP Concepts","topic":"Static","stage":"current","difficulty":"Medium","question":"When does a static block in Java run?","options":["At program exit only","When a method returns","Once, when the class is first loaded","Every time an object is created"],"correctIndex":2,"explanation":"A static block runs once when the class is loaded into memory, before any object is created."},{"category":"OOP Concepts","topic":"Copying","stage":"current","difficulty":"Medium","question":"What is the difference between a shallow copy and a deep copy?","options":["They are identical","A deep copy is faster","A shallow copy copies only methods","A shallow copy shares referenced objects, a deep copy duplicates them"],"correctIndex":3,"explanation":"A shallow copy copies field values, so referenced objects are shared; a deep copy creates new copies of the referenced objects too."},{"category":"OOP Concepts","topic":"Operator overloading","stage":"current","difficulty":"Medium","question":"In C++, which operator is commonly overloaded so objects can be printed with cout?","options":["<<","+","==",">>"],"correctIndex":0,"explanation":"Overloading the stream insertion operator << lets a class define how its objects are printed with cout."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Hard","question":"In C++, what happens if a base-class destructor is not virtual and an object is deleted through a base pointer?","options":["Only the base destructor runs, so derived resources may leak","A new object is created","The program always crashes","The derived destructor always runs"],"correctIndex":0,"explanation":"Without a virtual destructor, deleting through a base pointer calls only the base destructor and derived cleanup is skipped."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Hard","question":"How does C++ implement runtime polymorphism under the hood?","options":["With a stack of objects","With a virtual table (vtable) of function pointers per class","With a linked list of names","With a hash table"],"correctIndex":1,"explanation":"Each class with virtual methods has a vtable of function pointers, and each object stores a pointer to its class vtable."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Hard","question":"What is object slicing in C++?","options":["Deleting a base object","Splitting a class into two files","Losing the derived part when a derived object is assigned to a base object by value","Cutting an object in half"],"correctIndex":2,"explanation":"Assigning a derived object to a base object by value copies only the base part, so the derived fields and behaviour are lost."},{"category":"OOP Concepts","topic":"Friend function","stage":"current","difficulty":"Hard","question":"What can a friend function in C++ do?","options":["Access private and protected members of a class although it is not a member","Inherit from the class","Access only public members","Create objects without a constructor"],"correctIndex":0,"explanation":"A friend function is declared inside a class and may access its private and protected members, though it is not a member itself."},{"category":"OOP Concepts","topic":"Constructors","stage":"current","difficulty":"Hard","question":"Can an abstract class in Java have a constructor?","options":["No, never","Only if it is final","Only if it has no fields","Yes, it runs when a subclass object is created"],"correctIndex":3,"explanation":"An abstract class can have a constructor; it runs as part of subclass construction to initialise inherited fields."},{"category":"OOP Concepts","topic":"Interface","stage":"current","difficulty":"Hard","question":"Since Java 8, what can an interface contain besides abstract methods?","options":["No methods at all","Default and static methods with bodies","Only private classes","Only fields"],"correctIndex":1,"explanation":"Java 8 added default methods and static methods to interfaces, so they can provide a body while remaining interfaces."},{"category":"OOP Concepts","topic":"Method overriding","stage":"current","difficulty":"Hard","question":"When a subclass overrides a method, what is true of its access level?","options":["It must become private","It cannot be more restrictive than the parent version","It must be more restrictive","It must become static"],"correctIndex":1,"explanation":"An overriding method cannot reduce visibility: a public parent method cannot become protected or private in the child."},{"category":"OOP Concepts","topic":"Method overriding","stage":"current","difficulty":"Hard","question":"What is a covariant return type in Java overriding?","options":["Returning a subtype of the parent method return type","Returning a primitive instead of an object","Returning void always","Returning a completely unrelated type"],"correctIndex":0,"explanation":"An overriding method may return a subtype of the original return type, which is called a covariant return type."},{"category":"OOP Concepts","topic":"Static","stage":"current","difficulty":"Hard","question":"Can a static method be overridden in Java?","options":["Yes, exactly like an instance method","Yes, if it is final","No, static methods cannot be called","No, it is only hidden by a subclass static method"],"correctIndex":3,"explanation":"Static methods belong to the class, so a subclass version hides rather than overrides the parent version; the call depends on the reference type."},{"category":"OOP Concepts","topic":"Exception handling","stage":"current","difficulty":"Hard","question":"When a subclass overrides a method, what is true of checked exceptions it declares?","options":["It cannot declare broader checked exceptions than the parent method","It cannot declare any exception","It may declare broader checked exceptions","It must declare all exceptions"],"correctIndex":0,"explanation":"An overriding method cannot throw broader checked exceptions than the overridden method, though it may throw fewer or narrower ones."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Hard","question":"What does the Liskov Substitution Principle require?","options":["Every class must have one parent","A subclass object must be usable wherever its parent type is expected","Objects must never be cast","Subclasses must be final"],"correctIndex":1,"explanation":"Liskov substitution means a subclass must honour the parent contract, so it can safely replace a parent object anywhere."},{"category":"OOP Concepts","topic":"Design","stage":"current","difficulty":"Hard","question":"Why is composition often preferred over inheritance?","options":["It uses less code in every case","It is always faster","It avoids tight coupling and fragile parent-child dependence","It forbids reuse"],"correctIndex":2,"explanation":"Composition builds behaviour from parts at runtime and avoids the fragile base-class problem of deep inheritance hierarchies."},{"category":"OOP Concepts","topic":"this pointer","stage":"current","difficulty":"Hard","question":"In C++, what is the this pointer?","options":["A null pointer","A pointer to a static variable","A pointer to the parent class","An implicit pointer to the current object available in non-static member functions"],"correctIndex":3,"explanation":"this is an implicit pointer to the object on which a non-static member function was called."},{"category":"OOP Concepts","topic":"Singleton","stage":"current","difficulty":"Hard","question":"How is a singleton class normally implemented?","options":["With a private constructor and a static method returning the single instance","With only static fields","With an abstract class","With many public constructors"],"correctIndex":0,"explanation":"A singleton hides its constructor and provides a static accessor that creates and returns the one shared instance."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the binary number 1101 in decimal?","options":["15","13","12","11"],"correctIndex":1,"explanation":"1101 = 8 + 4 + 0 + 1 = 13."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the binary number 10101 in decimal?","options":["17","21","23","19"],"correctIndex":1,"explanation":"10101 = 16 + 0 + 4 + 0 + 1 = 21."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the binary number 11100 in decimal?","options":["24","26","28","30"],"correctIndex":2,"explanation":"11100 = 16 + 8 + 4 + 0 + 0 = 28."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is decimal 19 in binary?","options":["10001","10011","11001","10101"],"correctIndex":1,"explanation":"19 = 16 + 2 + 1, so its binary form is 10011."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is decimal 33 in binary?","options":["100001","110001","100011","101001"],"correctIndex":0,"explanation":"33 = 32 + 1, so its binary form is 100001."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is decimal 45 in binary?","options":["101101","110101","101001","101011"],"correctIndex":0,"explanation":"45 = 32 + 8 + 4 + 1, so its binary form is 101101."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the hexadecimal number 2F in decimal?","options":["41","49","47","45"],"correctIndex":2,"explanation":"2F = 2 x 16 + 15 = 32 + 15 = 47."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the hexadecimal number 3C in decimal?","options":["58","62","60","56"],"correctIndex":2,"explanation":"3C = 3 x 16 + 12 = 48 + 12 = 60."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the hexadecimal number 1E in decimal?","options":["26","32","28","30"],"correctIndex":3,"explanation":"1E = 1 x 16 + 14 = 30."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is decimal 200 in hexadecimal?","options":["C6","D8","C8","B8"],"correctIndex":2,"explanation":"200 = 12 x 16 + 8, and 12 in hex is C, so the answer is C8."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the octal number 17 in decimal?","options":["13","19","17","15"],"correctIndex":3,"explanation":"17 in octal = 1 x 8 + 7 = 15."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the octal number 27 in decimal?","options":["23","19","25","21"],"correctIndex":0,"explanation":"27 in octal = 2 x 8 + 7 = 23."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is decimal 63 in octal?","options":["77","75","73","67"],"correctIndex":0,"explanation":"63 = 7 x 8 + 7, so its octal form is 77."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the binary number 1010 in octal?","options":["14","12","10","11"],"correctIndex":1,"explanation":"Grouping 1010 from the right in threes gives 001 010, which is 1 and 2, so 12 in octal."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the binary number 110111 in octal?","options":["65","71","63","67"],"correctIndex":3,"explanation":"Grouping 110111 in threes gives 110 111, which is 6 and 7, so 67 in octal."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the hexadecimal number 9D in decimal?","options":["155","153","157","159"],"correctIndex":2,"explanation":"9D = 9 x 16 + 13 = 144 + 13 = 157."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is decimal 100 in binary?","options":["1100100","1101000","1010100","1001100"],"correctIndex":0,"explanation":"100 = 64 + 32 + 4, so its binary form is 1100100."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Easy","question":"What is the binary number 1000001 in decimal?","options":["65","63","67","61"],"correctIndex":0,"explanation":"1000001 = 64 + 1 = 65."},{"category":"Digital Logic & Basics","topic":"Data units","stage":"past","difficulty":"Easy","question":"How many bits are there in 2 bytes?","options":["16","32","12","8"],"correctIndex":0,"explanation":"One byte is 8 bits, so 2 bytes are 16 bits."},{"category":"Digital Logic & Basics","topic":"Data units","stage":"past","difficulty":"Easy","question":"How many kilobytes are there in 1 megabyte?","options":["1000","100","1024","512"],"correctIndex":2,"explanation":"In binary units, 1 megabyte equals 1024 kilobytes."},{"category":"Digital Logic & Basics","topic":"Data units","stage":"past","difficulty":"Easy","question":"How many megabytes are there in 1 gigabyte?","options":["1000","2048","1024","100"],"correctIndex":2,"explanation":"In binary units, 1 gigabyte equals 1024 megabytes."},{"category":"Digital Logic & Basics","topic":"Data units","stage":"past","difficulty":"Easy","question":"How many bits make one nibble?","options":["4","2","8","16"],"correctIndex":0,"explanation":"A nibble is half a byte, so it contains 4 bits."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of an AND gate when its inputs are 1 and 0?","options":["2","Cannot be decided","1","0"],"correctIndex":3,"explanation":"An AND gate gives 1 only when all its inputs are 1, so 1 AND 0 is 0."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of an OR gate when its inputs are 0 and 0?","options":["2","1","0","Cannot be decided"],"correctIndex":2,"explanation":"An OR gate gives 1 when at least one input is 1; with both inputs 0 the output is 0."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of a NOT gate when its input is 1?","options":["2","0","It stays 1","1"],"correctIndex":1,"explanation":"A NOT gate inverts its input, so NOT 1 is 0."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of a NAND gate when its inputs are 1 and 1?","options":["Cannot be decided","2","1","0"],"correctIndex":3,"explanation":"NAND is NOT AND, so 1 NAND 1 is the inversion of 1, which is 0."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of a NOR gate when its inputs are 0 and 0?","options":["1","2","0","Cannot be decided"],"correctIndex":0,"explanation":"NOR is NOT OR, so 0 NOR 0 is the inversion of 0, which is 1."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of an XOR gate when its inputs are 1 and 1?","options":["1","2","0","Cannot be decided"],"correctIndex":2,"explanation":"XOR gives 1 only when the inputs differ; with both inputs 1 the output is 0."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of an XNOR gate when its inputs are 1 and 1?","options":["1","0","Cannot be decided","2"],"correctIndex":0,"explanation":"XNOR gives 1 when the inputs are the same, so 1 XNOR 1 is 1."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of an OR gate when its inputs are 1 and 0?","options":["Cannot be decided","0","1","2"],"correctIndex":2,"explanation":"An OR gate gives 1 when at least one input is 1, so 1 OR 0 is 1."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of a NAND gate when its inputs are 0 and 1?","options":["2","Cannot be decided","0","1"],"correctIndex":3,"explanation":"0 AND 1 is 0, and NAND inverts it, so the output is 1."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of a NOR gate when its inputs are 1 and 0?","options":["2","0","1","Cannot be decided"],"correctIndex":1,"explanation":"1 OR 0 is 1, and NOR inverts it, so the output is 0."},{"category":"Digital Logic & Basics","topic":"Logic gates","stage":"past","difficulty":"Easy","question":"What is the output of an XOR gate when its inputs are 0 and 1?","options":["2","0","Cannot be decided","1"],"correctIndex":3,"explanation":"XOR gives 1 when the inputs differ, so 0 XOR 1 is 1."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Easy","question":"In Boolean algebra, what is A AND 0?","options":["0","NOT A","A","1"],"correctIndex":0,"explanation":"Anything ANDed with 0 is 0, so A AND 0 equals 0."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Easy","question":"In Boolean algebra, what is A OR 0?","options":["NOT A","0","A","1"],"correctIndex":2,"explanation":"ORing with 0 changes nothing, so A OR 0 equals A."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Easy","question":"In Boolean algebra, what is A OR A?","options":["0","1","NOT A","A"],"correctIndex":3,"explanation":"ORing a variable with itself gives the same variable, so A OR A equals A."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Easy","question":"In Boolean algebra, what is A AND A?","options":["NOT A","A","1","0"],"correctIndex":1,"explanation":"ANDing a variable with itself gives the same variable, so A AND A equals A."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Easy","question":"In Boolean algebra, what is NOT (NOT A)?","options":["NOT A","1","0","A"],"correctIndex":3,"explanation":"Inverting twice returns the original value, so NOT (NOT A) equals A."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Easy","question":"In Boolean algebra, what is A OR (NOT A)?","options":["NOT A","0","1","A"],"correctIndex":2,"explanation":"A variable OR its complement is always 1, so A OR (NOT A) equals 1."},{"category":"Digital Logic & Basics","topic":"Adders","stage":"past","difficulty":"Easy","question":"In a half adder, which gate produces the sum output?","options":["NAND","AND","XOR","OR"],"correctIndex":2,"explanation":"A half adder produces its sum with an XOR gate and its carry with an AND gate."},{"category":"Digital Logic & Basics","topic":"Adders","stage":"past","difficulty":"Easy","question":"How many inputs does a full adder have?","options":["2","4","3","1"],"correctIndex":2,"explanation":"A full adder has three inputs: A, B and the carry-in from the previous stage."},{"category":"Digital Logic & Basics","topic":"Multiplexer","stage":"past","difficulty":"Easy","question":"How many select lines does a 2-to-1 multiplexer need?","options":["0","2","3","1"],"correctIndex":3,"explanation":"A 2-to-1 multiplexer chooses between 2 inputs, so it needs 1 select line."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Medium","question":"What is -5 in 8-bit two's complement binary?","options":["11111011","10000101","11110101","11111010"],"correctIndex":0,"explanation":"5 is 00000101; inverting gives 11111010 and adding 1 gives 11111011."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Medium","question":"What is -12 in 8-bit two's complement binary?","options":["11101100","11110100","11110011","10001100"],"correctIndex":1,"explanation":"12 is 00001100; inverting gives 11110011 and adding 1 gives 11110100."},{"category":"Digital Logic & Basics","topic":"Binary arithmetic","stage":"past","difficulty":"Medium","question":"What is 1011 + 0110 in binary?","options":["10101","10001","10011","11101"],"correctIndex":1,"explanation":"1011 is 11 and 0110 is 6, so the sum is 17, which is 10001 in binary."},{"category":"Digital Logic & Basics","topic":"Binary arithmetic","stage":"past","difficulty":"Medium","question":"What is 1101 + 1010 in binary?","options":["10011","10111","10101","11011"],"correctIndex":1,"explanation":"1101 is 13 and 1010 is 10, so the sum is 23, which is 10111 in binary."},{"category":"Digital Logic & Basics","topic":"Binary arithmetic","stage":"past","difficulty":"Medium","question":"What is 1010 - 0110 in binary?","options":["1000","0110","0010","0100"],"correctIndex":3,"explanation":"1010 is 10 and 0110 is 6, so the difference is 4, which is 0100 in binary."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Medium","question":"In Boolean algebra, what does A + AB simplify to?","options":["A + B","B","AB","A"],"correctIndex":3,"explanation":"By the absorption law, A + AB equals A, because A already covers the AB term."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Medium","question":"In Boolean algebra, what does A(A + B) simplify to?","options":["AB","A + B","A","B"],"correctIndex":2,"explanation":"By the absorption law, A(A + B) equals A, because A ANDed with anything containing A is just A."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Medium","question":"According to De Morgan's law, what is NOT (A OR B) equal to?","options":["A OR B","(NOT A) AND (NOT B)","A AND B","(NOT A) OR (NOT B)"],"correctIndex":1,"explanation":"De Morgan's law gives NOT (A OR B) = (NOT A) AND (NOT B)."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Medium","question":"Which expression is equal to A XOR B?","options":["A'B' + AB","AB + A'B'","A'B + AB'","A + B"],"correctIndex":2,"explanation":"XOR is 1 when exactly one input is 1, which is A'B + AB'."},{"category":"Digital Logic & Basics","topic":"Flip-flops","stage":"past","difficulty":"Medium","question":"In a JK flip-flop, what happens when J = 1 and K = 1 at the clock edge?","options":["The output is set to 1","The output toggles","The output is set to 0","The output holds its value"],"correctIndex":1,"explanation":"With J = K = 1, a JK flip-flop toggles its output at the clock edge."},{"category":"Digital Logic & Basics","topic":"Flip-flops","stage":"past","difficulty":"Medium","question":"In an SR flip-flop, what is the S = 1, R = 1 condition called?","options":["Invalid or forbidden state","Set state","Hold state","Reset state"],"correctIndex":0,"explanation":"S = R = 1 tries to set and reset at once, so it is the invalid or forbidden state of an SR flip-flop."},{"category":"Digital Logic & Basics","topic":"Counters","stage":"past","difficulty":"Medium","question":"How many flip-flops are needed for a mod-8 counter?","options":["8","2","4","3"],"correctIndex":3,"explanation":"A mod-8 counter has 8 states, and 2 to the power 3 is 8, so it needs 3 flip-flops."},{"category":"Digital Logic & Basics","topic":"Counters","stage":"past","difficulty":"Medium","question":"How many distinct states does a 4-bit binary counter have?","options":["8","32","16","12"],"correctIndex":2,"explanation":"A 4-bit counter has 2 to the power 4, or 16, distinct states, counting from 0 to 15."},{"category":"Digital Logic & Basics","topic":"Multiplexer","stage":"past","difficulty":"Medium","question":"How many select lines does a 4-to-1 multiplexer need?","options":["2","3","4","1"],"correctIndex":0,"explanation":"A 4-to-1 multiplexer chooses among 4 inputs, and 2 select lines give 4 combinations."},{"category":"Digital Logic & Basics","topic":"Multiplexer","stage":"past","difficulty":"Medium","question":"How many select lines does an 8-to-1 multiplexer need?","options":["3","2","4","8"],"correctIndex":0,"explanation":"An 8-to-1 multiplexer chooses among 8 inputs, and 3 select lines give 8 combinations."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Hard","question":"What is the Gray code 1101 converted back to binary?","options":["1001","1101","1011","1010"],"correctIndex":0,"explanation":"Gray to binary: first bit 1, then each next bit is the XOR of the previous binary bit and the Gray bit, giving 1001."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Hard","question":"Which of these is NOT a valid BCD code?","options":["1010","1001","0101","0111"],"correctIndex":0,"explanation":"BCD uses only 0000 to 1001 for digits 0 to 9, so 1010, which would be 10, is not a valid BCD digit."},{"category":"Digital Logic & Basics","topic":"Binary arithmetic","stage":"past","difficulty":"Hard","question":"Using two's complement, what is 0101 - 0011 in binary?","options":["0100","0011","0001","0010"],"correctIndex":3,"explanation":"0011 negated in two's complement is 1101; 0101 + 1101 = 10010, and dropping the extra carry gives 0010, which is 2."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Hard","question":"In Boolean algebra, what does (A + B)(A + C) simplify to?","options":["A + BC","A + B + C","A(B + C)","AB + AC"],"correctIndex":0,"explanation":"By the distributive law, (A + B)(A + C) equals A + BC."},{"category":"Digital Logic & Basics","topic":"Boolean algebra","stage":"past","difficulty":"Hard","question":"In Boolean algebra, what does A + A'B simplify to?","options":["A","AB","A'B","A + B"],"correctIndex":3,"explanation":"A + A'B equals A + B, because when A is 0 the term A'B gives B, and when A is 1 the result is 1 anyway."},{"category":"Digital Logic & Basics","topic":"Flip-flops","stage":"past","difficulty":"Hard","question":"What is the characteristic equation of a JK flip-flop?","options":["Q+ = JQ' + K'Q","Q+ = S + R'Q","Q+ = D","Q+ = T XOR Q"],"correctIndex":0,"explanation":"The next state of a JK flip-flop is Q+ = J times NOT Q, OR NOT K times Q."},{"category":"Digital Logic & Basics","topic":"Flip-flops","stage":"past","difficulty":"Hard","question":"What is the characteristic equation of a T flip-flop?","options":["Q+ = JQ' + K'Q","Q+ = T XOR Q","Q+ = D","Q+ = S + R'Q"],"correctIndex":1,"explanation":"A T flip-flop holds its state when T is 0 and toggles when T is 1, so Q+ = T XOR Q."},{"category":"Digital Logic & Basics","topic":"Flip-flops","stage":"past","difficulty":"Hard","question":"What is the race-around condition in a JK flip-flop?","options":["The clock is too slow","The output toggles many times while the clock stays high with J = K = 1","The output never changes","The flip-flop stores two bits"],"correctIndex":1,"explanation":"If the clock pulse stays high too long with J = K = 1, the output keeps toggling, so its final value is unpredictable."},{"category":"Digital Logic & Basics","topic":"Flip-flops","stage":"past","difficulty":"Hard","question":"Which flip-flop design is used to solve the race-around condition?","options":["Master-slave flip-flop","SR flip-flop","D flip-flop","T flip-flop"],"correctIndex":0,"explanation":"A master-slave flip-flop transfers the state in two stages on opposite clock phases, so the output cannot toggle repeatedly in one pulse."},{"category":"Digital Logic & Basics","topic":"Counters","stage":"past","difficulty":"Hard","question":"What is the main drawback of a ripple counter?","options":["It cannot count down","It needs a separate clock for each bit","Its total propagation delay grows with the number of flip-flops","It uses too many gates"],"correctIndex":2,"explanation":"In a ripple counter each flip-flop is clocked by the previous one, so delays add up and the last bit changes late."},{"category":"Digital Logic & Basics","topic":"Adders","stage":"past","difficulty":"Hard","question":"What is the sum output of a full adder in terms of A, B and carry-in Cin?","options":["A XOR B XOR Cin","A AND B OR Cin","A OR B OR Cin","A AND B AND Cin"],"correctIndex":0,"explanation":"The full adder sum is 1 when an odd number of its three inputs are 1, which is A XOR B XOR Cin."},{"category":"Digital Logic & Basics","topic":"Adders","stage":"past","difficulty":"Hard","question":"What is the carry-out of a full adder in terms of A, B and carry-in Cin?","options":["AB + Cin","A XOR B XOR Cin","AB + Cin(A XOR B)","A + B + Cin"],"correctIndex":2,"explanation":"A carry is produced when A and B are both 1, or when Cin is 1 and exactly one of A and B is 1, giving AB + Cin(A XOR B)."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Hard","question":"What is the excess-3 code of the decimal digit 5?","options":["1010","1000","0110","0101"],"correctIndex":1,"explanation":"Excess-3 adds 3 to the digit, so 5 + 3 = 8, which is 1000 in binary."},{"category":"Digital Logic & Basics","topic":"Number system","stage":"past","difficulty":"Hard","question":"What is -5 in 8-bit sign-magnitude binary?","options":["11111011","11110101","10000101","10001010"],"correctIndex":2,"explanation":"In sign-magnitude, the first bit is the sign, 1 for negative, followed by the magnitude 0000101, giving 10000101."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What is the kernel of an operating system?","options":["A text editor","A web browser","A virus scanner","The core part that manages hardware and basic services"],"correctIndex":3,"explanation":"The kernel is the core of the operating system; it manages the CPU, memory and hardware devices."},{"category":"Future Topics","topic":"Operating Systems","stage":"upcoming","difficulty":"Easy","question":"What is a thread?","options":["A file stored on a hard disk","A cable that connects a monitor","The smallest unit of execution inside a process","A type of computer virus"],"correctIndex":2,"explanation":"A thread is the smallest unit of execution within a proces
