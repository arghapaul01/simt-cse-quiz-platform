    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef3fb;
        --surface: #ffffff;
        --surface2: #e3ebf9;
        --text: #0b1e3f;
        --dim: #5a6d8f;
        --border: #cfdcf2;
        --accent: #0b5ed7;
        --accent2: #10b981;
        --amber: #f59e0b;
        --coral: #e11d48;
        --rose-soft: #fff1f2;
        --emerald-soft: #ecfdf5;
        --blue-soft: #eff6ff;
        --font-display: "Baloo 2", "Hind Siliguri", system-ui, sans-serif;
        --font-body: "Hind Siliguri", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --surface: #111c30;
          --surface2: #16263f;
          --text: #e8eef7;
          --dim: #8fa3bf;
          --border: #22354f;
          --accent: #38bdf8;
          --accent2: #34d399;
          --rose-soft: rgba(225,29,72,.14);
          --emerald-soft: rgba(16,185,129,.13);
          --blue-soft: rgba(11,94,215,.18);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }
      img { max-width: 100%; }
      .font-display { font-family: var(--font-display); }
      .wrap { margin-inline: auto; width: 100%; padding-inline: 1rem; }
      .wrap-3xl { max-width: 48rem; }
      .wrap-2xl { max-width: 42rem; }
      .wrap-5xl { max-width: 64rem; }

      /* ---------- Animations (same motion language as the platform) ---------- */
      @keyframes floaty { 0% { transform: translateY(0) rotate(var(--rot, 0deg)); opacity: var(--op, .5); } 50% { transform: translateY(-22px) rotate(calc(var(--rot, 0deg) + 8deg)); opacity: calc(var(--op, .5) + .12); } 100% { transform: translateY(0) rotate(var(--rot, 0deg)); opacity: var(--op, .5); } }
      @keyframes drift { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      @keyframes popIn { 0% { transform: scale(.85) translateY(14px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
      @keyframes slideQ { 0% { transform: translateX(46px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
      @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 100% { box-shadow: 0 0 0 16px rgba(16,185,129,0); } }
      @keyframes confettiFall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: .7; } }
      @keyframes bounceSoft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes tickerUp { 0% { transform: translateY(10px); opacity: 0; } 12%, 88% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
      @keyframes aurora { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(46px, -34px) scale(1.18); } 66% { transform: translate(-30px, 22px) scale(.92); } }
      @keyframes sweepX { 0% { transform: translateX(-130%) skewX(-14deg); } 55%, 100% { transform: translateX(260%) skewX(-14deg); } }
      @keyframes twinkle { 0%, 100% { opacity: .1; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.25) rotate(24deg); } }
      @keyframes gradientPan { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes riseIn { 0% { transform: translateY(26px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
      @keyframes explainIn { 0% { opacity: 0; transform: translateY(10px) scale(.98); filter: blur(3px); } 60% { filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
      @keyframes bulbGlow { 0%, 100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.18) rotate(5deg); } }
      @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
      .anim-explain { animation: explainIn .65s cubic-bezier(.2,1,.3,1) both; }
      .anim-bulb { display: inline-block; animation: bulbGlow 1.6s ease-in-out infinite; }
      .anim-aurora { animation: aurora 13s ease-in-out infinite; }
      .anim-sweep { animation: sweepX 4.2s ease-in-out infinite; }
      .anim-twinkle { animation: twinkle 2.6s ease-in-out infinite; }
      .anim-rise { animation: riseIn .6s cubic-bezier(.2,1,.3,1) both; }
      .live-dot { display:inline-block;height:10px;width:10px;border-radius:999px;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:liveDotPulse 1.6s ease-out infinite; }
      @keyframes liveDotPulse { 0% { box-shadow:0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow:0 0 0 9px rgba(34,197,94,0); } 100% { box-shadow:0 0 0 0 rgba(34,197,94,0); } }
      .anim-floaty { animation: floaty 6s ease-in-out infinite; }
      .anim-pop { animation: popIn .45s cubic-bezier(.2,1.4,.4,1) both; }
      .anim-slide-q { animation: slideQ .38s ease both; }
      .anim-shake { animation: shakeX .45s ease; }
      .anim-pulse-glow { animation: pulseGlow .7s ease-out 2; }
      .anim-bounce-soft { animation: bounceSoft 2.2s ease-in-out infinite; }
      .anim-spin-slow { animation: spinSlow 26s linear infinite; }
      .anim-ticker { animation: tickerUp 4.2s ease both; }
      .anim-pulse { animation: pulseSoft 1.6s ease-in-out infinite; }
      .text-anim-gradient { background: linear-gradient(90deg, #34d399, #38bdf8, #fbbf24, #34d399); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradientPan 6s ease infinite; }
      .mesh-bg { background: radial-gradient(600px 300px at 15% 10%, rgba(11,94,215,.5), transparent 60%), radial-gradient(500px 260px at 85% 20%, rgba(16,185,129,.38), transparent 60%), radial-gradient(700px 400px at 50% 100%, rgba(245,158,11,.22), transparent 60%), linear-gradient(160deg, #0b1220 0%, #0d1b33 55%, #081a2e 100%); background-size: 200% 200%; animation: drift 18s linear infinite alternate; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

      /* ---------- Shared components ---------- */
      .card { background: var(--surface); border-radius: 24px; box-shadow: 0 1px 3px rgba(11,30,63,.07); outline: 1px solid var(--border); outline-offset: -1px; }
      .btn { border: 0; border-radius: 16px; padding: .65rem 1rem; font-weight: 700; font-size: .95rem; transition: transform .12s ease, filter .15s ease, background .15s ease; }
      .btn:active { transform: scale(.98); }
      .btn:disabled { opacity: .55; cursor: default; }
      .btn-primary { background: linear-gradient(90deg, #0b5ed7, #10b981); color: #fff; box-shadow: 0 8px 20px rgba(11,94,215,.28); font-family: var(--font-display); font-weight: 800; }
      .btn-primary:hover { filter: brightness(1.1); }
      .btn-dark { background: linear-gradient(90deg, #1e293b, #475569); color: #fff; box-shadow: 0 8px 20px rgba(15,23,42,.3); font-family: var(--font-display); font-weight: 800; }
      .btn-ghost { background: var(--surface); color: var(--dim); box-shadow: 0 1px 3px rgba(11,30,63,.07); outline: 1px solid var(--border); outline-offset: -1px; border-radius: 999px; padding: .5rem 1rem; font-size: .875rem; }
      .btn-ghost:hover { color: var(--coral); }
      .btn-ghost.blue:hover { color: var(--accent); }
      .chip { display: inline-block; border-radius: 999px; padding: .3rem .7rem; font-size: 11px; font-weight: 700; }
      .chip-blue { background: var(--blue-soft); color: #1d4ed8; }
      .chip-green { background: var(--emerald-soft); color: #047857; }
      .chip-amber { background: #fef3c7; color: #b45309; }
      .chip-rose { background: var(--rose-soft); color: #be123c; }
      @media (prefers-color-scheme: dark) { .chip-blue { color: #93c5fd; } .chip-green { color: #6ee7b7; } .chip-amber { background: rgba(245,158,11,.16); color: #fcd34d; } .chip-rose { color: #fda4af; } }
      .field label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: .25rem; }
      .field input, .field select, .field textarea { width: 100%; border-radius: 12px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; padding: .6rem .85rem; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
      .field input:focus, .field select:focus, .field textarea:focus { border-color: #0b5ed7; box-shadow: 0 0 0 4px #dbeafe; }
      .field input::placeholder { color: #b6c2d2; }
      .field .hint { margin-top: .25rem; font-size: 12px; color: #94a3b8; }
      .field.on-app label { color: var(--dim); }
      .field.on-app input, .field.on-app select, .field.on-app textarea { border-color: var(--border); background: var(--surface); color: var(--text); font-size: 14px; padding: .5rem .75rem; }
      .field.on-app input:focus, .field.on-app select:focus, .field.on-app textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,94,215,.18); }
      .alert-error { border-radius: 12px; background: #fff1f2; color: #e11d48; padding: .55rem .8rem; font-size: 13px; font-weight: 600; }
      .alert-ok { border-radius: 12px; background: var(--emerald-soft); color: #047857; padding: .55rem .8rem; font-size: 14px; font-weight: 600; }
      @media (prefers-color-scheme: dark) { .alert-ok { color: #6ee7b7; } }
      .progress-track { height: 12px; border-radius: 999px; background: var(--surface2); overflow: hidden; flex: 1; }
      .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #0b5ed7, #10b981); transition: width .5s ease; }
      .progress-fill.live { background: linear-gradient(90deg, #f43f5e, #f59e0b); }
      .opt-btn { display: flex; width: 100%; align-items: center; gap: .75rem; border: 0; border-radius: 16px; padding: .85rem 1rem; text-align: left; font-size: 15px; font-weight: 600; background: var(--surface2); color: var(--text); transition: box-shadow .15s, transform .1s, background .15s, opacity .15s; }
      .opt-btn:not(:disabled):hover { box-shadow: inset 0 0 0 2px rgba(11,94,215,.5); }
      .opt-btn:not(:disabled):active { transform: scale(.99); }
      .opt-btn:disabled { cursor: default; }
      .opt-letter { font-family: var(--font-display); display: flex; height: 2rem; width: 2rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px; font-size: .875rem; font-weight: 800; background: var(--surface); color: var(--accent); outline: 1px solid var(--border); outline-offset: -1px; }
      .opt-correct { background: #10b981 !important; color: #fff !important; box-shadow: 0 10px 22px rgba(16,185,129,.35); }
      .opt-wrong { background: #f43f5e !important; color: #fff !important; box-shadow: 0 10px 22px rgba(244,63,94,.35); }
      .opt-picked { background: #0b5ed7 !important; color: #fff !important; }
      .opt-dim { opacity: .6; }
      .opt-correct .opt-letter, .opt-wrong .opt-letter, .opt-picked .opt-letter { background: rgba(255,255,255,.25); color: #fff; outline: none; }
      .bottom-nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 30; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 95%, transparent); backdrop-filter: blur(8px); padding-bottom: env(safe-area-inset-bottom); }
      .bottom-nav .inner { margin-inline: auto; display: grid; max-width: 48rem; grid-template-columns: repeat(3, 1fr); }
      .bottom-nav button { border: 0; background: none; padding: .8rem .25rem; text-align: center; font-size: .875rem; font-weight: 700; color: var(--dim); min-height: 3rem; }
      .bottom-nav button.active { color: var(--accent); }
      .avatar { font-family: var(--font-display); display: flex; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #0b5ed7, #10b981); object-fit: cover; }
      .seg { display: grid; gap: .25rem; border-radius: 16px; background: #f1f5f9; padding: .25rem; }
      .seg button { border: 0; border-radius: 12px; padding: .5rem; font-family: var(--font-display); font-size: .875rem; font-weight: 700; color: #64748b; background: none; transition: all .15s; min-height: 2.5rem; }
      .seg button.on { background: #0b5ed7; color: #fff; box-shadow: 0 6px 14px rgba(11,94,215,.3); }
      .seg.dark button.on { background: #0f172a; }
      .seg.rose button.on { background: #0f172a; }
      details summary { min-height: 2.25rem; }
      /* ---------- Full-width mobile header ---------- */
      .app-header { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
      .app-header .brand-card { flex: 1 1 100%; min-width: 0; }
      .app-header .header-actions { display: flex; flex-shrink: 0; gap: .5rem; margin-left: auto; }
      @media (max-width: 639px) {
        .app-header .brand-card { padding: .75rem 1rem; }
        .brand-title { font-size: 19px !important; line-height: 1.3; }
        .brand-badge { font-size: 12px !important; padding: .4rem .8rem !important; white-space: normal; line-height: 1.5; }
      }
      @media (min-width: 640px) {
        .app-header { flex-wrap: nowrap; }
        .app-header .brand-card { flex: 1 1 auto; }
      }
    </style>

    <script>
      "use strict";
      /* ================= Data: the platform question bank ================= */
      const BANK_DATA = {"bank":[{"category":"C Programming","topic":"Loops","stage":"past","difficulty":"Medium","question":"In C, which loop is best when you know exactly how many times to repeat?","options":["while loop","for loop","do-while loop","goto loop"],"correctIndex":1,"explanation":"for loop packs init, condition and update in one line — perfect for a known count."},{"category":"C Programming","topic":"Data types","stage":"past","difficulty":"Easy","question":"What is the size of an int on most modern 32/64-bit systems in C?","options":["1 byte","2 bytes","4 bytes","8 bytes"],"correctIndex":2,"explanation":"int is typically 4 bytes on modern compilers like GCC."},{"category":"C Programming","topic":"Arrays","stage":"past","difficulty":"Easy","question":"If int a[5] = {10,20,30,40,50}; what is a[2]?","options":["10","20","30","40"],"correctIndex":2,"explanation":"Array index starts at 0, so a[2] is the third element: 30."},{"category":"C Programming","topic":"Functions","stage":"past","difficulty":"Easy","question":"What does a function use to send a value back to the caller?","options":["printf","return","break","scanf"],"correctIndex":1,"explanation":"The return statement sends a value back from a function."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Medium","question":"In C, what is the value of 17 % 5?","options":["2","3","3.4","5"],"correctIndex":0,"explanation":"% gives the remainder: 17 = 5×3 + 2, so the remainder is 2."},{"category":"C Programming","topic":"Pointers","stage":"past","difficulty":"Hard","question":"Which operator gives the address of a variable in C?","options":["*","&","#","@"],"correctIndex":1,"explanation":"& is the address-of operator; * is used to dereference a pointer."},{"category":"C Programming","topic":"Strings","stage":"past","difficulty":"Easy","question":"A string in C always ends with which special character?","options":["\\n","\\t","\\0","$"],"correctIndex":2,"explanation":"Every C string ends with the null character '\\0'."},{"category":"C Programming","topic":"Conditionals","stage":"past","difficulty":"Easy","question":"Which statement is used for multi-way decisions based on one integer value?","options":["if","switch","for","struct"],"correctIndex":1,"explanation":"switch compares one value against many case labels."},{"category":"Data Structures","topic":"Stack","stage":"current","difficulty":"Medium","question":"A stack follows which order of insertion and removal?","options":["FIFO","LIFO","Random","Sorted"],"correctIndex":1,"explanation":"Stack is Last In First Out — like a pile of plates."},{"category":"Data Structures","topic":"Queue","stage":"current","difficulty":"Medium","question":"In a queue, elements are removed from which end?","options":["Rear end","Middle","Front end","Both ends"],"correctIndex":2,"explanation":"Queue removes from the front and inserts at the rear — First In First Out."},{"category":"Data Structures","topic":"Linked List","stage":"current","difficulty":"Hard","question":"Each node of a singly linked list contains data and…?","options":["Only an index","A pointer to the next node","A copy of the whole list","Two data fields"],"correctIndex":1,"explanation":"A node stores data plus a next pointer linking to the following node."},{"category":"Data Structures","topic":"Arrays vs List","stage":"current","difficulty":"Medium","question":"What is the time complexity of accessing the 100th element of an array by index?","options":["O(n)","O(log n)","O(1)","O(n²)"],"correctIndex":2,"explanation":"Array index access is direct, so it is constant time O(1)."},{"category":"Data Structures","topic":"Trees","stage":"current","difficulty":"Hard","question":"In a binary tree, each node can have at most how many children?","options":["1","2","3","Unlimited"],"correctIndex":1,"explanation":"Binary means at most two children: left and right."},{"category":"Data Structures","topic":"Searching","stage":"current","difficulty":"Medium","question":"Binary search only works correctly when the array is…?","options":["Unsorted","Sorted","Full of duplicates","Stored in a linked list"],"correctIndex":1,"explanation":"Binary search compares with the middle element, which requires sorted data."},{"category":"Data Structures","topic":"Sorting","stage":"current","difficulty":"Hard","question":"Bubble sort compares and swaps which elements?","options":["First and last","Random pairs","Adjacent pairs","Only even positions"],"correctIndex":2,"explanation":"Bubble sort repeatedly compares neighbouring elements and swaps if out of order."},{"category":"Data Structures","topic":"Recursion","stage":"current","difficulty":"Hard","question":"Every recursive function must have a…?","options":["Loop","Base case","Global variable","Pointer"],"correctIndex":1,"explanation":"Without a base case, recursion never stops and the stack overflows."},{"category":"OOP Concepts","topic":"Class & Object","stage":"current","difficulty":"Medium","question":"What is an object in OOP?","options":["A function","An instance of a class","A data type keyword","A compiler"],"correctIndex":1,"explanation":"A class is the blueprint; an object is a real instance created from it."},{"category":"OOP Concepts","topic":"Encapsulation","stage":"current","difficulty":"Hard","question":"Encapsulation mainly means…?","options":["Hiding data and bundling it with methods","Copying a class","Running code faster","Deleting unused objects"],"correctIndex":0,"explanation":"Encapsulation bundles data + methods and hides internal details."},{"category":"OOP Concepts","topic":"Inheritance","stage":"current","difficulty":"Medium","question":"Inheritance allows a class to…?","options":["Reuse properties of another class","Become a function","Hide from the compiler","Run without memory"],"correctIndex":0,"explanation":"A child class inherits fields and methods of its parent class."},{"category":"OOP Concepts","topic":"Polymorphism","stage":"current","difficulty":"Hard","question":"Method overloading is an example of…?","options":["Inheritance","Compile-time polymorphism","Encapsulation","Abstraction"],"correctIndex":1,"explanation":"Same method name with different parameters is decided at compile time."},{"category":"OOP Concepts","topic":"Constructor","stage":"current","difficulty":"Medium","question":"When is a constructor called?","options":["When the program ends","When an object is created","When a method is called","Never automatically"],"correctIndex":1,"explanation":"The constructor runs automatically at object creation to initialise it."},{"category":"OOP Concepts","topic":"Access modifiers","stage":"current","difficulty":"Medium","question":"Which member can only be accessed inside its own class?","options":["public","protected","private","static"],"correctIndex":2,"explanation":"private members are visible only within the same class."},{"category":"OOP Concepts","topic":"Abstraction","stage":"current","difficulty":"Medium","question":"Abstraction focuses on…?","options":["Showing only essential features, hiding details","Writing longer code","Using more variables","Avoiding classes"],"correctIndex":0,"explanation":"Like a car steering wheel — you use it without knowing the engine details."},{"category":"OOP Concepts","topic":"Java basics","stage":"current","difficulty":"Medium","question":"In Java, which keyword is used to inherit a class?","options":["implements","extends","inherits","super"],"correctIndex":1,"explanation":"class Child extends Parent — extends is the inheritance keyword."},{"category":"Database • DBMS","topic":"Keys","stage":"current","difficulty":"Medium","question":"A primary key must be…?","options":["Duplicate allowed","Unique and not NULL","Always a string","Changed frequently"],"correctIndex":1,"explanation":"Primary key uniquely identifies each row and can never be NULL."},{"category":"Database • DBMS","topic":"SQL basics","stage":"current","difficulty":"Medium","question":"Which SQL command reads data from a table?","options":["INSERT","UPDATE","SELECT","DELETE"],"correctIndex":2,"explanation":"SELECT is used to query and read rows from a table."},{"category":"Database • DBMS","topic":"SQL filter","stage":"current","difficulty":"Medium","question":"Which clause filters rows in a SELECT query?","options":["ORDER BY","WHERE","GROUP BY","FROM"],"correctIndex":1,"explanation":"WHERE sets the condition rows must satisfy to be returned."},{"category":"Database • DBMS","topic":"Foreign key","stage":"current","difficulty":"Medium","question":"A foreign key in a table refers to…?","options":["Its own primary key only","The primary key of another (or same) table","A password field","An index name"],"correctIndex":1,"explanation":"Foreign keys create relationships between tables."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"The main goal of normalization is to reduce…?","options":["Number of tables to one","Data redundancy","Query speed only","Table size to zero"],"correctIndex":1,"explanation":"Normalization organises tables to remove duplicate data and anomalies."},{"category":"Database • DBMS","topic":"DBMS vs file","stage":"current","difficulty":"Medium","question":"Which is an example of a popular DBMS?","options":["MySQL","Photoshop","MS Word","VLC"],"correctIndex":0,"explanation":"MySQL is a widely used relational DBMS — the one in your course stack."},{"category":"Database • DBMS","topic":"Tables","stage":"current","difficulty":"Medium","question":"In a relational database, one row of a table is also called a…?","options":["Field","Record / tuple","Schema","Query"],"correctIndex":1,"explanation":"Rows are records (tuples); columns are fields (attributes)."},{"category":"Database • DBMS","topic":"SQL sorting","stage":"current","difficulty":"Medium","question":"Which clause sorts the result of a query?","options":["WHERE","LIMIT","ORDER BY","HAVING"],"correctIndex":2,"explanation":"ORDER ":"current","difficulty":"Medium","question":"Which transport protocol is best for a file download that must arrive perfectly?","options":["UDP","TCP","ICMP","ARP"],"correctIndex":1,"explanation":"TCP's retransmission and ordering guarantee the file arrives complete and correct."},{"category":"Computer Networking","topic":"Basics","stage":"current","difficulty":"Easy","question":"A topology where all devices connect to one central switch is called…?","options":["Ring","Bus","Star","Mesh"],"correctIndex":2,"explanation":"Star topology centres on a switch/hub; most modern LANs use it."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Medium","question":"SSH is used for…?","options":["Sending mail","Secure remote login to another computer","Hosting websites","Printing"],"correctIndex":1,"explanation":"Secure Shell encrypts remote terminal sessions, replacing the old Telnet."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Hard","question":"Which layer of the OSI model is responsible for dialog control and session establishment?","options":["Transport","Session","Network","Application"],"correctIndex":1,"explanation":"The Session layer (Layer 5) sets up, manages and tears down sessions between applications."},{"category":"Computer Networking","topic":"Wireless","stage":"current","difficulty":"Medium","question":"What does SSID mean in a Wi-Fi network?","options":["The password","The network name broadcast by the access point","The channel number","The MAC address"],"correctIndex":1,"explanation":"SSID = Service Set Identifier — the visible name of the Wi-Fi network."},{"category":"Computer Networking","topic":"Basics","stage":"current","difficulty":"Easy","question":"The internet is best described as…?","options":["One giant computer","A global network of interconnected networks","A single website","A satellite"],"correctIndex":1,"explanation":"'Inter-network' — millions of networks linked by c  clock signal","The inverse of D"],"correctIndex":0,"explanation":"A D flip-flop copies the D input to Q on the active clock edge, so Q follows D."},{"category":"C Programming","topic":"Preprocessor","stage":"current","difficulty":"Medium","question":"What does #define PI 3.14 do in a C program?","options":["Declares a float variable","Replaces PI with 3.14 before compilation","Creates a constant at runtime","Includes a header file"],"correctIndex":1,"explanation":"The preprocessor does simple text replacement of PI with 3.14 before the compiler runs."},{"category":"C Programming","topic":"Recursion","stage":"current","difficulty":"Medium","question":"Why is a base case needed in a recursive function?","options":["To make it run faster","To stop the recursion and avoid infinite calls","To use less memory","To return a float"],"correctIndex":1,"explanation":"Without a base case the function keeps calling itself until the stack overflows."},{"category":"C Programming","topic":"Memory","stage":"current","difficulty":"Medium","question":"What does malloc() return in C?","options":["A pointer to zeroed memory","A pointer to uninitialized memory, or NULL on failure","An integer size","A freed pointer"],"correctIndex":1,"explanation":"malloc allocates raw memory without clearing it; it returns NULL when allocation fails."},{"category":"C Programming","topic":"Structures","stage":"current","difficulty":"Medium","question":"Which operator is used to access a member of a struct variable in C?","options":["-> only","Dot (.) operator","Scope (::) operator","Address (&) operator"],"correctIndex":1,"explanation":"For a struct variable use the dot operator, as in student.name; -> is for a pointer to a struct."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Medium","question":"What does Second Normal Form (2NF) remove from a table?","options":["Transitive dependency","Partial dependency on part of a composite key","Duplicate rows","NULL value t","stage":"past","difficulty":"Medium","question":"Why does scanf(\"%s\", name) stop reading at a space?","options":["It reads only one word because %s stops at whitespace","It reads the whole line","It skips spaces","It stores the space as well"],"correctIndex":0,"explanation":"%s reads a sequence of non-whitespace characters, so input stops at the first space."},{"category":"C Programming","topic":"File handling","stage":"past","difficulty":"Medium","question":"What does fopen(\"data.txt\", \"a\") do if data.txt does not exist?","options":["Opens it for reading","Returns NULL","Creates the file and opens it for appending","Deletes the file"],"correctIndex":2,"explanation":"Mode \"a\" creates the file when it is missing and appends at the end."},{"category":"C Programming","topic":"Memory","stage":"past","difficulty":"Medium","question":"What does calloc(5, sizeof(int)) do that malloc(5 * sizeof(int)) does not?","options":["It frees the memory automatically","It returns an int instead of a pointer","It allocates more memory","It sets all the allocated bytes to zero"],"correctIndex":3,"explanation":"calloc zero-initializes the allocated block, while malloc leaves it uninitialized."},{"category":"C Programming","topic":"Pointers","stage":"past","difficulty":"Hard","question":"On a 64-bit system, what is sizeof(int *) in C?","options":["8","2","16","4"],"correctIndex":0,"explanation":"A pointer is 8 bytes on a 64-bit system, regardless of the type it points to."},{"category":"C Programming","topic":"Pointers","stage":"past","difficulty":"Hard","question":"If int a[3] = {10, 20, 30}; and int *p = a; what does *p++ do?","options":["Gives 20","Increments the value 10 to 11","Moves p to the next element and gives 10","Increments a[0] and a[1]"],"correctIndex":2,"explanation":"*p++ is parsed as *(p++), so it yields the current value 10 and then advances p."},{"category":"C Programming","topic":"Memory","stage":"past","difficulty":"Hard","question":"What happens if a program keeps calling malloc() in a loop and never calls free()?","options":["The memory is reused automatically","Nothing, malloc reuses old blocks","The program runs faster","Memory is leaked until it runs out"],"correctIndex":3,"explanation":"Allocated memory that is never freed is a leak, and the program's memory use keeps growing."},{"category":"C Programming","topic":"Memory","stage":"past","difficulty":"Hard","question":"What is the likely result of dereferencing a NULL pointer in C?","options":["A crash, typically a segmentation fault","It allocates memory","It reads the first byte of the program","It returns 0 safely"],"correctIndex":0,"explanation":"NULL points to no valid object, so dereferencing it is undefined and usually crashes the program."},{"category":"C Programming","topic":"Recursion","stage":"past","difficulty":"Hard","question":"Why can a recursive function with no base case crash a program?","options":["It corrupts the source file","It uses too much heap memory","Each call adds a stack frame until the stack overflows","It divides by zero"],"correctIndex":2,"explanation":"Unbounded recursion keeps pushing stack frames until the stack is exhausted."},{"category":"C Programming","topic":"Functions","stage":"past","difficulty":"Hard","question":"What does the declaration int (*fp)(int); define in C?","options":["An array of functions","A function pointer that takes no arguments","A function returning a pointer","A pointer to a function that takes an int and returns an int"],"correctIndex":3,"explanation":"The parentheses make fp a pointer to a function with one int parameter and an int return type."},{"category":"C Programming","topic":"Arrays","stage":"past","difficulty":"Hard","question":"What does the declaration int (*p)[4]; define in C?","options":["A pointer to an array of 4 ints","A 4x4 array","A pointer to a single int","An array of 4 int pointers"],"correctIndex":0,"explanation":"p is a pointer to a whole array of 4 ints, not an array of pointers."},{"category":"C Programming","topic":"Arrays","stage":"past","difficulty":"Hard","question":"If int arr[5] = {1, 2, 3, 4, 5}; what is sizeof(arr) on a system where int is 4 bytes?","options":["4","5","20","8"],"correctIndex":2,"explanation":"sizeof gives the total size of the array: 5 elements times 4 bytes = 20."},{"category":"C Programming","topic":"Strings","stage":"past","difficulty":"Hard","question":"What happens if a program tries to change a character of a string literal, such as char *s = \"hi\"; s[0] = 'H';?","options":["It changes every string in the program","It works normally","It is undefined behaviour and may crash","It creates a new string"],"correctIndex":2,"explanation":"String literals may be stored in read-only memory, so writing to one is undefined behaviour."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Hard","question":"What is the value of 1 << 4 in C?","options":["4","8","16","32"],"correctIndex":2,"explanation":"Shifting 1 left by 4 positions multiplies it by 2^4, giving 16."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Hard","question":"What is the value of 32 >> 3 in C?","options":["4","8","29","35"],"correctIndex":0,"explanation":"Shifting 32 right by 3 divides it by 2^3, giving 4."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Hard","question":"What is the value of 5 << 2 in C?","options":["7","10","20","25"],"correctIndex":2,"explanation":"Shifting 5 left by 2 multiplies it by 4, giving 20."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Hard","question":"What is the value of 12 & 10 in C?","options":["12","10","8","2"],"correctIndex":2,"explanation":"12 is 1100 and 10 is 1010 in binary; their bitwise AND is 1000, which is 8."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Hard","question":"What is the value of 12 | 10 in C?","options":["8","2","22","14"],"correctIndex":3,"explanation":"12 is 1100 and 10 is 1010 in binary; their bitwise OR is 1110, which is 14."},{"category":"C Programming","topic":"Operators","stage":"past","difficulty":"Hard","question":"What is the value of 5 ^ 3 in C?","options":["6","2","7","8"],"correctIndex":0,"explanation":"5 is 101 and 3 is 011 in binary; their bitwise XOR is 110, which is 6."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"What is a database?","options":["A type of network cable","A programming language","An organized collection of related data","A computer virus"],"correctIndex":2,"explanation":"A database stores related data in an organized way so it can be retrieved and managed."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"What is a DBMS?","options":["Software that creates and manages databases","A database table","A backup file","A programming language"],"correctIndex":0,"explanation":"A database management system is the software used to define, store, retrieve and manage data."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"Which of these is a relational DBMS?","options":["MySQL","MongoDB","Redis","Cassandra"],"correctIndex":0,"explanation":"MySQL stores data in tables with rows and columns, so it is a relational DBMS."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"In a relational database, a table is also called what?","options":["A field","A query","A tuple","A relation"],"correctIndex":3,"explanation":"A table in the relational model is formally called a relation."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"In a table, a column is also called what?","options":["A tuple","A record","An attribute","A key"],"correctIndex":2,"explanation":"Each column of a table represents an attribute of the entity."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"In a relational table, what does the degree of the table mean?","options":["The number of columns","The number of keys","The size in bytes","The number of rows"],"correctIndex":0,"explanation":"Degree is the number of attributes, that is, the number of columns."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"In a relational table, what does cardinality mean?","options":["The number of keys","The number of columns","The number of rows","The number of tables"],"correctIndex":2,"explanation":"Cardinality is the number of tuples, that is, the number of rows."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"What is the domain of an attribute?","options":["The primary key of the table","The number of rows","The table it belongs to","The set of allowed values for that attribute"],"correctIndex":3,"explanation":"A domain is the set of values an attribute is allowed to take, such as integers from 0 to 100."},{"category":"Database • DBMS","topic":"Basics","stage":"current","difficulty":"Easy","question":"What is a database instance?","options":["The actual data stored in the database at a particular moment","A backup copy","A query result","The schema of the database"],"correctIndex":0,"explanation":"The instance is the current data in the database, while the schema is its structure."},{"category":"Database • DBMS","topic":"Keys","stage":"current","difficulty":"Easy","question":"What is a super key?","options":["A key that allows duplicates","A key that is always numeric","Any set of attributes that uniquely identifies each row","A key shared by two tables"],"correctIndex":2,"explanation":"A super key is any attribute set whose values are unique for every row."},{"category":"Database • DBMS","topic":"Keys","stage":"current","difficulty":"Easy","question":"What is an alternate key?","options":["A key with duplicate values","A composite key","A foreign key","A candidate key that was not chosen as the primary key"],"correctIndex":3,"explanation":"Candidate keys not selected as the primary key are called alternate keys."},{"category":"Database • DBMS","topic":"Keys","stage":"current","difficulty":"Easy","question":"What does a foreign key enforce between two tables?","options":["Referential integrity, so a value must exist in the referenced table","That both tables have the same name","That the tables cannot be joined","That both tables have the same number of rows"],"correctIndex":0,"explanation":"A foreign key value must match an existing primary key value in the referenced table."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does SELECT * FROM students; do?","options":["Creates a new table","Deletes the students table","Returns all columns of all rows in students","Returns only the first row"],"correctIndex":2,"explanation":"The * means all columns, and with no WHERE clause every row is returned."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What is the FROM clause used for in SQL?","options":["To sort the result","To group rows","To filter rows","To specify the table to read from"],"correctIndex":3,"explanation":"FROM names the table or tables the query reads data from."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"In SQL, what is the default sort order of ORDER BY?","options":["Ascending","Random","By insertion order","Descending"],"correctIndex":0,"explanation":"ORDER BY sorts in ascending order unless DESC is written."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does ORDER BY marks DESC do?","options":["Counts the marks","Sorts marks from smallest to largest","Sorts marks from largest to smallest","Removes duplicate marks"],"correctIndex":2,"explanation":"DESC sorts in descending order, largest first."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does LIMIT 5 do in a SELECT query?","options":["Deletes 5 rows","Returns 5 columns","Skips the first 5 rows","Returns at most the first 5 rows of the result"],"correctIndex":3,"explanation":"LIMIT restricts the number of rows returned to 5."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"Which SQL operator combines two conditions so that both must be true?","options":["OR","NOT","AND","IN"],"correctIndex":2,"explanation":"AND returns a row only when both conditions are true."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"Which SQL operator combines two conditions so that at least one must be true?","options":["AND","NOT","OR","BETWEEN"],"correctIndex":2,"explanation":"OR returns a row when either condition, or both, is true."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does the SQL operator NOT do?","options":["Reverses the truth of a condition","Deletes a row","Counts rows","Joins two tables"],"correctIndex":0,"explanation":"NOT turns a true condition false and a false condition true."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does the IN operator do in a WHERE clause?","options":["Checks whether a value matches any value in a list","Checks whether a value is NULL","Joins two tables","Sorts the result"],"correctIndex":0,"explanation":"WHERE city IN ('Dhaka', 'Barishal') matches rows whose city is in that list."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"How do you test whether a column value is missing in SQL?","options":["IS EMPTY","= NULL","IS NULL","== NULL"],"correctIndex":2,"explanation":"NULL is not equal to anything, so the IS NULL test must be used."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"In the LIKE pattern 'A%', what does % match?","options":["Exactly one digit","The letter A only","Exactly one character","Any sequence of zero or more characters"],"correctIndex":3,"explanation":"% is a wildcard for any number of characters, so 'A%' matches names starting with A."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"In the LIKE pattern '_a%', what does the underscore _ match?","options":["Exactly one character","Zero characters","The letter a","Any sequence of characters"],"correctIndex":0,"explanation":"The underscore wildcard matches exactly one character in that position."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does the LIKE pattern '%a' match?","options":["Values equal to a","Values starting with a","Values ending with a","Values containing a in the middle"],"correctIndex":2,"explanation":"% matches any prefix, so '%a' matches values whose last character is a."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does COUNT(*) return in SQL?","options":["The largest value","The average value","The sum of a column","The number of rows"],"correctIndex":3,"explanation":"COUNT(*) counts all rows that satisfy the query."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does SUM(marks) return in SQL?","options":["The total of all marks values","The average marks","The highest marks","The number of students"],"correctIndex":0,"explanation":"SUM adds up all the values in the numeric column."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does AVG(marks) return in SQL?","options":["The total of the marks","The average of the marks values","The number of students","The lowest marks"],"correctIndex":1,"explanation":"AVG  the given values."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What happens if you run UPDATE students SET marks = 90; with no WHERE clause?","options":["Only the first row is updated","Every row in the table is updated","No row is updated","The table is deleted"],"correctIndex":1,"explanation":"Without WHERE, UPDATE applies to all rows, so every student's marks become 90."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What is the main difference between DELETE and DROP in SQL?","options":["DELETE removes rows, DROP removes the whole table","DELETE removes the table, DROP removes rows","They are identical","DELETE is faster than DROP"],"correctIndex":0,"explanation":"DELETE removes rows while keeping the table; DROP removes the table itself."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"Which SQL statement gives a user permission to access a table?","options":["ALLOW","GRANT","PERMIT","SHARE"],"correctIndex":1,"explanation":"GRANT gives a privilege, such as SELECT, to a user or role."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"Which SQL statement takes away a permission previously given with GRANT?","options":["DENY","REMOVE","REVOKE","DELETE"],"correctIndex":2,"explanation":"REVOKE removes a privilege that was granted earlier."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"What does ROLLBACK do in a transaction?","options":["Saves the changes permanently","Undoes the changes made since the last COMMIT","Deletes the database","Starts a new transaction"],"correctIndex":1,"explanation":"ROLLBACK discards the uncommitted changes of the current transaction."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"A table has students with marks 70, 80, 90. What does SELECT COUNT(*) FROM students WHERE marks > 75 return?","options":["1","2","3","0"],"correctIndex":1,"explanation":"Only the marks 80 and 90 are above 75, so the count is 2."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"A table has students with marks 70, 80, 90. What does SELECT SUM(marks) FROM students return?","options":["240","80","90","170"],"correctIndex":0,"explanation":"70 + 80 + 90 = 240."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"A table has students with marks 70, 80, 90. What does SELECT AVG(marks) FROM students return?","options":["70","80","90","240"],"correctIndex":1,"explanation":"(70 + 80 + 90) / 3 = 80."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Easy","question":"A table has 4 students in CSE and 3 in EEE. What does SELECT COUNT(*) FROM students WHERE dept = 'CSE' return?","options":["7","4","3","1"],"correctIndex":1,"explanation":"Only the 4 CSE rows match the condition."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Medium","question":"What kind of dependency does Third Normal Form (3NF) remove?","options":["Partial dependency","Transitive dependency, where a non-key attribute depends on another non-key attribute","Multivalued dependency","Join dependency"],"correctIndex":1,"explanation":"3NF requires every non-key attribute to depend directly on the key, with no dependency through another non-key attribute."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Medium","question":"Which of these violates First Normal Form (1NF)?","options":["A column holding a single phone number per row","A column holding several phone numbers in one cell","A table with a primary key","A column holding only integers"],"correctIndex":1,"explanation":"1NF requires atomic values, so a cell holding a list of phone numbers violates it."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Medium","question":"In ACID, what does Isolation mean?","options":["A transaction is saved permanently","Transactions run as if they were alone, without seeing each other's unfinished changes","A transaction always succeeds","A transaction can be split into parts"],"correctIndex":1,"explanation":"Isolation hides the intermediate states of concurrent transactions from each other."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Medium","question":"In ACID, what does Consistency mean?","options":["A transaction is fast","A transaction moves the database from one valid state to another valid state","A transaction never fails","A transaction uses only one table"],"correctIndex":1,"explanation":"Consistency means all rules and constraints still hold after the transaction finishes."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Medium","question":"What is a shared lock in a database?","options":["A lock that lets several transactions read the same data","A lock that lets only one transaction write","A lock on the whole database","A lock that never expires"],"correctIndex":0,"explanation":"A shared lock allows concurrent reads but blocks writers until it is released."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Medium","question":"What is an exclusive lock in a database?","options":["A lock that allows many readers","A lock that gives one transaction sole access to read and write the data","A lock that is shared by all users","A lock on a view"],"correctIndex":1,"explanation":"An exclusive lock blocks both readers and writers, so only the holder can access the item."},{"category":"Database • DBMS","topic":"Joins","stage":"current","difficulty":"Medium","question":"What does a RIGHT JOIN return?","options":["Only matching rows","All rows from the right table plus matching left rows, with NULL where there is no match","All rows from the left table only","Rows that match in neither table"],"correctIndex":1,"explanation":"RIGHT JOIN keeps every row of the right table and fills NULLs for unmatched left columns."},{"category":"Database • DBMS","topic":"Joins","stage":"current","difficulty":"Medium","question":"What does a CROSS JOIN between a table of 3 rows and a table of 4 rows return?","options":["7 rows","12 rows","4 rows","3 rows"],"correctIndex":1,"explanation":"A cross join pairs every row of one table with every row of the other, so 3 x 4 = 12 rows."},{"category":"Database • DBMS","topic":"Joins","stage":"current","difficulty":"Medium","question":"What does a FULL OUTER JOIN return?","options":["Only matching rows","All rows from both tables, with NULLs where there is no match on either side","All rows from the left table only","All rows from the right table only"],"correctIndex":1,"explanation":"A full outer join keeps unmatched rows from both tables and fills the missing side with NULL."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Medium","question":"What is a subquery?","options":["A query that deletes data","A query nested inside another query","A query that joins three tables","A query that runs on a different server"],"correctIndex":1,"explanation":"A subquery is a SELECT inside another SELECT, INSERT, UPDATE or DELETE statement."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Medium","question":"What is the difference between UNION and UNION ALL?","options":["UNION removes duplicate rows, UNION ALL keeps them","UNION keeps duplicates, UNION ALL removes them","UNION joins tables, UNION ALL sorts them","There is no difference"],"correctIndex":0,"explanation":"UNION returns distinct combined rows, while UNION ALL returns every row including duplicates."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Medium","question":"What does the EXISTS operator test in SQL?","options":["Whether a column is NULL","Whether a subquery returns at least one row","Whether a table exists","Whether a value is in a list"],"correctIndex":1,"explanation":"EXISTS is true when the subquery produces one or more rows."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Medium","question":"Which HAVING condition keeps only departments with more than 5 students?","options":["WHERE COUNT(*) > 5","HAVING COUNT(*) > 5","GROUP BY COUNT(*) > 5","ORDER BY COUNT(*) > 5"],"correctIndex":1,"explanation":"HAVING filters groups after GROUP BY, so HAVING COUNT(*) > 5 keeps only groups with more than 5 rows."},{"category":"Database • DBMS","topic":"SQL","stage":"current","difficulty":"Medium","question":"What is a correlated subquery?","options":["A subquery that runs once before the outer query","A subquery that refers to a column of the outer query and runs once per outer row","A subquery with no WHERE clause","A subquery that joins two databases"],"correctIndex":1,"explanation":"Because it uses an outer-query column, a correlated subquery must be re-evaluated for each row of the outer query."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Hard","question":"What is a lost update problem in concurrent transactions?","options":["A transaction deletes a row by mistake","Two transactions read the same value and each writes back, so one update overwrites and loses the other","A transaction runs too slowly","A commit is lost after a crash"],"correctIndex":1,"explanation":"When both transactions base their write on the same old value, the second write silently discards the first update."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Hard","question":"What is a dirty read?","options":["Reading data that was deleted","Reading uncommitted data written by another transaction that may later roll back","Reading data from a backup","Reading the same row twice"],"correctIndex":1,"explanation":"A dirty read sees changes that are not yet committed, so the data may disappear if that transaction rolls back."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Hard","question":"What is a non-repeatable read?","options":["Reading a row that does not exist","Reading the same row twice in one transaction and getting different values because another transaction changed it","Reading a table twice and getting the same result","Reading uncommitted data"],"correctIndex":1,"explanation":"If another transaction commits a change between the two reads, the same row shows a different value."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Hard","question":"What is a phantom read?","options":["Reading a deleted row","Reading the same range twice and finding new rows inserted by another transaction","Reading a row that was never committed","Reading with a wrong index"],"correctIndex":1,"explanation":"A phantom appears when a second range query returns rows that were inserted and committed in between."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Hard","question":"What does two-phase locking (2PL) guarantee?","options":["No deadlock can occur","Conflict serializability of the schedule","Faster queries","No locks are needed"],"correctIndex":1,"explanation":"In 2PL a transaction acquires all locks before releasing any, which guarantees a serializable schedule."},{"category":"Database • DBMS","topic":"Transactions","stage":"current","difficulty":"Hard","question":"What is strict two-phase locking?","options":["Locks are released as soon as they are used","Exclusive locks are held until the transaction commits or aborts","No shared locks are used","Locks are taken in alphabetical order"],"correctIndex":1,"explanation":"Strict 2PL holds exclusive locks to the end, which avoids cascading rollbacks."},{"category":"Database • DBMS","topic":"Recovery","stage":"current","difficulty":"Hard","question":"What is the purpose of a write-ahead log (WAL) in recovery?","options":["To speed up SELECT queries","To record changes on disk before the data pages are updated, so a crash can be undone or redone","To store user passwords","To index the tables"],"correctIndex":1,"explanation":"WAL writes the log record first, so after a crash the database can redo committed work and undo uncommitted work."},{"category":"Database • DBMS","topic":"Indexing","stage":"current","difficulty":"Hard","question":"Why is a B+ tree better than a B-tree for range queries?","options":["Its leaves are linked in order, so scanning a range is fast","It stores data only in internal nodes","It uses hashing","It needs no disk access"],"correctIndex":0,"explanation":"In a B+ tree all data is in the leaves, which are linked in sorted order, making range scans efficient."},{"category":"Database • DBMS","topic":"Indexing","stage":"current","difficulty":"Hard","question":"Why is a hash index a poor choice for a range query such as WHERE age BETWEEN 20 AND 30?","options":["Hashing is too slow for equality","A hash scatters values, so it cannot find a range without scanning","Hash indexes use too much memory","Hash indexes cannot be built on integers"],"correctIndex":1,"explanation":"A hash function gives no order, so a range cannot be located directly and would need a full scan."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"Given functional dependencies A -> B and B -> C, what is the closure of {A}?","options":["{A}","{A, B}","{A, B, C}","{A, C}"],"correctIndex":2,"explanation":"From A we get B, and from B we get C, so the closure of A is {A, B, C}."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"Given functional dependencies A -> B and C -> D, what is the closure of {A, C}?","options":["{A, C}","{A, B, C}","{A, B, C, D}","{A, C, D}"],"correctIndex":2,"explanation":"A gives B and C gives D, so the closure of {A, C} is {A, B, C, D}."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"In a relation R(A, B, C) with functional dependency A -> B and A -> C, what is a candidate key?","options":["B","C","A","{B, C}"],"correctIndex":2,"explanation":"A determines both B and C, so A alone identifies every row and is the candidate key."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"When is a decomposition of R into R1 and R2 lossless?","options":["When R1 and R2 have the same columns","When the common attributes functionally determine all attributes of R1 or of R2","When R1 and R2 have no common attributes","When both parts have a primary key"],"correctIndex":1,"explanation":"The lossless-join test is that R1 ∩ R2 -> R1 or R1 ∩ R2 -> R2 holds."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"What does Fourth Normal Form (4NF) remove?","options":["Partial dependencies","Transitive dependencies","Multivalued dependencies","Join dependencies"],"correctIndex":2,"explanation":"4NF requires a table to be in BCNF and to have no non-trivial multivalued dependencies."},{"category":"Database • DBMS","topic":"Normalization","stage":"current","difficulty":"Hard","question":"What does Fifth Normal Form (5NF) deal with?","options":["Multivalued dependencies","Join dependencies that cannot be removed without losing information","Partial dependencies","Duplicate rows"],"correctIndex":1,"explanation":"5NF requires that every join dependency is implied by the candidate keys, so the table cannot be split further without loss."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Easy","question":"Which OSI layer is responsible for transmitting raw bits over a physical cable?","options":["Physical layer","Session layer","Application layer","Transport layer"],"correctIndex":0,"explanation":"The Physical layer deals with cables, signals, voltages and the actual transmission of bits."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Easy","question":"Which OSI layer handles error detection and framing of data into frames?","options":["Application layer","Physical layer","Data Link layer","Network layer"],"correctIndex":0,"explanation":"The Data Link layer groups bits into frames and checks them for errors."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Easy","question":"Which OSI layer is responsible for end-to-end delivery and port numbers?","options":["Physical layer","Network layer","Transport layer","Data Link layer"],"correctIndex":0,"explanation":"The Transport layer provides end-to-end delivery and uses port numbers to reach the right application."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Easy","question":"Which OSI layer handles encryption, compression and data format conversion?","options":["Network layer","Session layer","Presentation layer","Transport layer"],"correctIndex":0,"explanation":"The Presentation layer translates data formats and handles encryption and compression."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Easy","question":"Which OSI layer manages starting, maintaining and ending communication sessions?","options":["Physical layer","Application layer","Session layer","Network layer"],"correctIndex":0,"explanation":"The Session layer sets up, manages and terminates sessions between applications."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Easy","question":"How many layers does the TCP/IP model have?","options":["7","3","4","5"],"correctIndex":0,"explanation":"The TCP/IP model has four layers: Link, Internet, Transport and Application."},{"category":"Computer Networking","topic":"OSI Model","stage":"current","difficulty":"Easy","question":"Which layer of the TCP/IP model corresponds to the OSI Network layer?","options":["Application layer","Link layer","Internet layer","Transport layer"],"correctIndex":0,"explanation":"The TCP/IP Internet layer handles logical addressing and routing, like the OSI Network layer."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol is used to transfer files between computers over a network?","options":["FTP","DNS","HTTP","SMTP"],"correctIndex":0,"explanation":"FTP (File Transfer Protocol) is designed for uploading and downloading files."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol sends email from a client to a mail server?","options":["SMTP","HTTP","POP3","IMAP"],"correctIndex":0,"explanation":"SMTP is the protocol used to send outgoing mail to a mail server."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol is used to receive email and keep messages on the server so they can be read from many devices?","options":["IMAP","Telnet","SMTP","FTP"],"correctIndex":0,"explanation":"IMAP keeps mail on the server and syncs it across devices, unlike POP3 which usually downloads and removes it."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol downloads email to a single device and usually deletes it from the server?","options":["SNMP","IMAP","POP3","SMTP"],"correctIndex":0,"explanation":"POP3 downloads messages to one device and normally removes them from the server afterwards."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol automatically assigns IP addresses to devices when they join a network?","options":["HTTP","DNS","DHCP","FTP"],"correctIndex":0,"explanation":"DHCP automatically gives devices an IP address, subnet mask and gateway."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol translates a website name such as example.com into an IP address?","options":["FTP","DHCP","DNS","HTTP"],"correctIndex":0,"explanation":"DNS resolves human-readable domain names into numeric IP addresses."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol provides secure remote login to another computer over a network?","options":["HTTP","Telnet","SSH","FTP"],"correctIndex":0,"explanation":"SSH gives an encrypted remote shell, while Telnet sends data including passwords in plain text."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol is used to send data between a web browser and a web server without encryption?","options":["HTTP","SMTP","HTTPS","FTP"],"correctIndex":0,"explanation":"HTTP transfers web pages in plain text; HTTPS adds encryption on top of it."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol is connectionless and does not guarantee delivery of packets?","options":["HTTP","FTP","TCP","UDP"],"correctIndex":3,"explanation":"UDP sends datagrams without a connection or delivery guarantee, which makes it fast."},{"category":"Computer Networking","topic":"Protocols","stage":"current","difficulty":"Easy","question":"Which protocol guarantees that data arrives in order and without errors?","options":["ICMP","ARP","UDP","TCP"],"correctIndex":3,"explanation":"TCP is connection-oriented: it checks order, retransmits lost segments and guarantees reliable delivery."},{"category":"Computer Networking","topic":"Ports","stage":"current","difficulty":"Easy","question":"Which port number is used by HTTP?","options":["21","22","53","80"],"correctIndex":3,"explanation":"HTTP uses port 80 by default."},{"category":"Computer Networking","topic":"Ports","stage":"current","difficulty":"Easy","question":"Which port number is used by HTTPS?","options":["110","443","25","80"],"correctIndex":3,"explanation":"HTTPS uses port 443 by default."},{"category":"Computer Networking","topic":"Ports","stage":"current","difficulty":"Easy","question":"Which port number is used by DNS?","options":["53","80","25","110"],"correctIndex":0,"explanation":"DNS normally uses port 53 for name-resolution queries."},{"category":"Computer Networking","topic":"Ports","stage":"current","difficulty":"Easy","question":"Which port number is used by SSH?","options":["23","25","21","22"],"correctIndex":3,"explanation":"SSH uses port 22 by default."},{"category":"Computer Networking","topic":"Ports","stage":"current","difficulty":"Easy","question":"Which port number is used by SMTP for sending email?","options":["143","25","53","110"],"correctIndex":3,"explanation":"SMTP uses port 25 by default for sending mail between servers."},{"category":"Computer Networking","topic":"Ports","stage":"current","difficulty":"Easy","question":"Which port number is used by FTP for control commands?","options":["22","23","20","21"],"correctIndex":3,"explanation":"FTP uses port 21 for the control connection and port 20 for data transfer."},{"category":"Computer Networking","topic":"Ports","stage":"current","difficulty":"Easy","question":"Which port number is used by Telnet?","options":["22","23","80","21"],"correctIndex":3,"explanation":"Telnet uses port 23 by default."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"How many bits long is an IPv4 address?","options":["64 bits","128 bits","16 bits","32 bits"],"correctIndex":3,"explanation":"An IPv4 address has 32 bits, written as four decimal numbers separated by dots."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"How many bits long is an IPv6 address?","options":["32 bits","64 bits","128 bits","256 bits"],"correctIndex":2,"explanation":"An IPv6 address has 128 bits, written as eight groups of hexadecimal digits."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"Which IP address is used to test your own computer, known as the loopback address?","options":["192.168.1.1","10.0.0.1","127.0.0.1","255.255.255.0"],"correctIndex":2,"explanation":"127.0.0.1 is the loopback address; traffic sent to it never leaves the local machine."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"Which address class does 10.0.0.0 belong to?","options":["Class A","Class B","Class C","Class D"],"correctIndex":0,"explanation":"Class A covers 1.0.0.0 to 126.255.255.255, and 10.0.0.0 is a private Class A range."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"Which class of IP address is used for multicasting?","options":["Class A","Class B","Class C","Class D"],"correctIndex":3,"explanation":"Class D (224.0.0.0 to 239.255.255.255) is reserved for multicast groups."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"Which of these is a public IP address?","options":["10.0.0.5","172.16.0.1","192.168.0.1","8.8.4.4"],"correctIndex":3,"explanation":"8.8.4.4 is a public Google DNS address; 10.x, 172.16.x and 192.168.x are private ranges."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"What is a MAC address used for?","options":["To encrypt data","To assign an IP address","To identify a website","To uniquely identify a network interface card"],"correctIndex":3,"explanation":"A MAC address is a hardware address burned into a network interface card and is unique to it."},{"category":"Computer Networking","topic":"IP Addressing","stage":"current","difficulty":"Easy","question":"How many bits long is a MAC address?","options":["64 bits","128 bits","32 bits","48 bits"],"correctIndex":3,"explanation":"A MAC address is 48 bits long, usually written as six pairs of hexadecimal digits."},{"category":"Computer Networking","topic":"Devices","stage":"current","difficulty":"Easy","question":"Which device forwards data inside a LAN by looking at MAC addresses?","options":["Router","Hub","Switch","Modem"],"correctIndex":2,"explanation":"A switch learns MAC addresses and forwards each frame only to the port of the destination device."},{"category":"Computer Networking","topic":"Devices","stage":"current","difficulty":"Easy","question":"Which device sends incoming data to every connected device without checking the destination?","options":["Switch","Router","Hub","Bridge"],"correctIndex":2,"explanation":"A hub simply repeats incoming signals to all ports, so every device receives the data."},{"category":"Computer Networking","topic":"Devices","stage":"current","difficulty":"Easy","question":"Which device converts digital signals from a computer into analogue signals for a telephone line?","options":["Router","Switch","Modem","Repeater"],"correctIndex":2,"explanation":"A modem modulates digital data into analogue signals and demodulates them back."},{"category":"Computer Networking","topic":"Devices","stage":"current","difficulty":"Easy","question":"Which device is used to strengthen a weak signal along a long cable?","options":["Repeater","Switch","Router","Gateway"],"correctIndex":0,"explanation":"A repeater receives a weak signal, regenerates it and sends it on at full strength."},{"category":"Computer Networking","topic":"Devices","stage":"current","difficulty":"Easy","question":"Which device connects networks that use different protocols and translates between them?","options":["Switch","Hub","Gateway","Repeater"],"correctIndex":2,"explanation":"A gateway sits between different networks and translates between different protocols."},{"category":"Computer Networking","topic":"Topologies","stage":"current","difficulty":"Easy","question":"In which topology are all devices connected to a single central cable?","options":["Ring topology","Mesh topology","Star topology","Bus topology"],"correctIndex":3,"explanation":"In a bus topology every device shares one central cable, called the backbone."},{"category":"Computer Networking","topic":"Topologies","stage":"current","difficulty":"Easy","question":"In which topology does every device connect directly to every other device?","options":["Star topology","Bus topology","Ring topology","Full mesh topology"],"correctIndex":3,"explanation":"In a full mesh each device has a direct link to every other device, giving the highest reliability."},{"category":"Computer Networking","topic":"Topologies","stage":"current","difficulty":"Easy","question":"In which topology is data passed around in a circle from one device to the next?","options":["Star topology","Bus topology","Ring topology","Tree topology"],"correctIndex":2,"explanation":"In a ring topology each device is connected to two neighbours and data travels around the ring."},{"category":"Computer Networking","topic":"Network Types","stage":"current","difficulty":"Easy","question":"What does WAN stand for?","options":["Wired Access Network","World Area Network","Wireless Area Network","Wide Area Network"],"correctIndex":3,"explanation":"WAN stands for Wide Area Network, a network covering a large geographical area such as a country."},{"category":"Computer Networking","topic":"Network Types","stage":"current","difficulty":"Easy","question":"What does MAN stand for?","options":["Metropolitan Area Network","Main Area Network","Mobile Area Network","Medium Area Network"],"correctIndex":0,"explanation":"MAN stands for Metropolitan Area Network, covering a city or large campus."},{"category":"Computer Networking","topic":"Network Types","stage":"current","difficulty":"Easy","question":"Which network type covers the smallest area, such as a single room or a person's devices?","options":["WAN","MAN","LAN","PAN"],"correctIndex":3,"explanation":"A PAN (Personal Area Network) covers a very small area, such as Bluetooth devices around one person."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"How many usable host addresses does a /26 subnet provide?","options":["126","254","30","62"],"correctIndex":3,"explanation":"A /26 leaves 6 host bits: 2^6 = 64 addresses, minus network and broadcast, giving 62 usable hosts."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"How many usable host addresses does a /27 subnet provide?","options":["62","126","14","30"],"correctIndex":3,"explanation":"A /27 leaves 5 host bits: 2^5 = 32 addresses, minus network and broadcast, giving 30 usable hosts."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"How many usable host addresses does a /28 subnet provide?","options":["30","62","6","14"],"correctIndex":3,"explanation":"A /28 leaves 4 host bits: 2^4 = 16 addresses, minus network and broadcast, giving 14 usable hosts."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"How many usable host addresses does a /25 subnet provide?","options":["254","510","62","126"],"correctIndex":3,"explanation":"A /25 leaves 7 host bits: 2^7 = 128 addresses, minus network and broadcast, giving 126 usable hosts."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"What is the network address of 192.168.5.73 with a /26 subnet mask?","options":["192.168.5.32","192.168.5.128","192.168.5.0","192.168.5.64"],"correctIndex":3,"explanation":"A /26 splits the last octet into blocks of 64, so 73 falls in the 64-127 block and the network address is 192.168.5.64."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"What is the broadcast address of 192.168.5.73 with a /26 subnet mask?","options":["192.168.5.127","192.168.5.255","192.168.5.63","192.168.5.191"],"correctIndex":0,"explanation":"The /26 block starting at 192.168.5.64 ends at 127, so the broadcast address is 192.168.5.127."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"What is the network address of 10.20.30.145 with a /25 subnet mask?","options":["10.20.30.0","10.20.30.64","10.20.30.128","10.20.30.192"],"correctIndex":2,"explanation":"A /25 splits the last octet into two blocks of 128, so 145 falls in the 128-255 block and the network address is 10.20.30.128."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Medium","question":"How many subnets can be created by borrowing 3 bits from the host part of a Class C network?","options":["4","6","8","16"],"correctIndex":2,"explanation":"Borrowing 3 bits gives 2^3 = 8 subnets."},{"category":"Computer Networking","topic":"Routing","stage":"current","difficulty":"Medium","question":"Which routing protocol is used between different autonomous systems on the internet?","options":["OSPF","RIP","BGP","EIGRP"],"correctIndex":2,"explanation":"BGP (Border Gateway Protocol) exchanges routing information between autonomous systems."},{"category":"Computer Networking","topic":"Routing","stage":"current","difficulty":"Medium","question":"Which routing protocol uses the Dijkstra algorithm to find the shortest path inside a network?","options":["BGP","EIGRP","RIP","OSPF"],"correctIndex":3,"explanation":"OSPF is a link-state protocol that builds a map of the network and runs Dijkstra's algorithm."},{"category":"Computer Networking","topic":"Routing","stage":"current","difficulty":"Medium","question":"What is the maximum hop count allowed in RIP before a route is considered unreachable?","options":["10","15","16","30"],"correctIndex":2,"explanation":"RIP limits routes to 15 hops; a hop count of 16 means the destination is unreachable."},{"category":"Computer Networking","topic":"Wireless","stage":"current","difficulty":"Medium","question":"Which multiple-access method is used by Wi-Fi to avoid collisions?","options":["Token passing","FDMA","CSMA/CD","CSMA/CA"],"correctIndex":3,"explanation":"Wi-Fi uses CSMA/CA, which tries to avoid collisions by waiting and using request-to-send messages, because wireless stations cannot reliably detect collisions."},{"category":"Computer Networking","topic":"Wireless","stage":"current","difficulty":"Medium","question":"Which Wi-Fi specification introduced the 5 GHz band with speeds up to 54 Mbps?","options":["802.11g","802.11n","802.11b","802.11a"],"correctIndex":3,"explanation":"802.11a operates in the 5 GHz band and offers up to 54 Mbps."},{"category":"Computer Networking","topic":"Security","stage":"current","difficulty":"Medium","question":"Which protocol is used by HTTPS to encrypt web traffic?","options":["SMTP","SNMP","FTP","SSL/TLS"],"correctIndex":3,"explanation":"HTTPS uses SSL/TLS to encrypt the data exchanged between browser and server."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Hard","question":"How many usable host addresses does a /23 subnet provide?","options":["1022","2046","254","510"],"correctIndex":3,"explanation":"A /23 leaves 9 host bits: 2^9 = 512 addresses, minus network and broadcast, giving 510 usable hosts."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Hard","question":"How many usable host addresses does a /29 subnet provide?","options":["14","30","2","6"],"correctIndex":3,"explanation":"A /29 leaves 3 host bits: 2^3 = 8 addresses, minus network and broadcast, giving 6 usable hosts."},{"category":"Computer Networking","topic":"Subnetting","stage":"current","difficulty":"Hard","question":"
